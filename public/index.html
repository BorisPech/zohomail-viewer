<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZohoMail Viewer</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════
   DESIGN TOKENS
═══════════════════════════════════════════ */
:root {
  --bg:      #080810;
  --s1:      #0e0e1c;
  --s2:      #14142a;
  --s3:      #1a1a35;
  --border:  #ffffff0a;
  --border2: #ffffff16;
  --accent:  #7c6ef7;
  --a2:      #f76e8a;
  --a3:      #4ecca3;
  --text:    #e2e2f0;
  --sub:     #8888a8;
  --muted:   #4a4a6a;
  --unread-bg:     #7c6ef712;
  --unread-border: #7c6ef7;
}
* { margin:0; padding:0; box-sizing:border-box }
html, body { height:100%; overflow:hidden; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif }

/* ambient glows */
body::before { content:''; position:fixed; top:-250px; left:-150px; width:600px; height:600px; background:radial-gradient(circle,#7c6ef70d,transparent 65%); pointer-events:none; z-index:0 }
body::after  { content:''; position:fixed; bottom:-250px; right:-150px; width:500px; height:500px; background:radial-gradient(circle,#f76e8a0a,transparent 65%); pointer-events:none; z-index:0 }

/* ═══════════════════════════════════════════
   HEADER
═══════════════════════════════════════════ */
.hdr {
  height:56px; display:flex; align-items:center; gap:12px; padding:0 20px;
  background:#080810cc; backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border2); position:relative; z-index:10; flex-shrink:0;
}
.hdr-logo {
  width:32px; height:32px; border-radius:9px; flex-shrink:0;
  background:linear-gradient(135deg,var(--accent),var(--a2));
  display:flex; align-items:center; justify-content:center; font-size:16px;
}
.hdr-title {
  font-family:'Syne',sans-serif; font-size:16px; font-weight:800;
  background:linear-gradient(90deg,var(--text),var(--accent));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
}
.hdr-space { flex:1 }
.hdr-badge {
  display:flex; align-items:center; gap:6px; padding:4px 14px;
  border-radius:20px; background:var(--s2); border:1px solid var(--border2);
  font-size:12px; color:var(--sub);
}
.live-dot {
  width:6px; height:6px; border-radius:50%; background:var(--a3);
  box-shadow:0 0 6px var(--a3); animation:blink 2s infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

/* ═══════════════════════════════════════════
   LAYOUT
═══════════════════════════════════════════ */
.layout {
  flex:1; display:grid; grid-template-columns:230px 1fr;
  overflow:hidden; position:relative; z-index:1; height:calc(100vh - 56px);
}

/* ═══════════════════════════════════════════
   SIDEBAR
═══════════════════════════════════════════ */
.sb {
  background:var(--s1); border-right:1px solid var(--border);
  overflow-y:auto; display:flex; flex-direction:column; padding:8px 0;
}
.sb-label { padding:10px 16px 4px; font-size:10px; font-weight:600; letter-spacing:2px; color:var(--muted); text-transform:uppercase }
.fi {
  display:flex; align-items:center; gap:9px; padding:9px 14px;
  cursor:pointer; border-left:3px solid transparent; transition:.15s;
  margin:1px 8px 1px 0; border-radius:0 8px 8px 0;
}
.fi:hover { background:var(--s2) }
.fi.on    { background:var(--unread-bg); border-left-color:var(--accent); color:var(--accent) }
.fi .ic   { font-size:14px; flex-shrink:0; width:18px; text-align:center }
.fi .nm   { flex:1; font-size:13px }
.fi .ct   { font-size:11px; font-weight:700; padding:1px 7px; border-radius:20px; background:var(--accent); color:#fff; min-width:22px; text-align:center }
.fi .ct.z { background:var(--s3); color:var(--muted) }
.sb-div   { height:1px; background:var(--border); margin:8px 14px }
.sb-foot  { margin-top:auto; padding:12px 16px; border-top:1px solid var(--border) }
.sb-foot-lbl { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:4px }
.sb-foot-em  { font-size:11px; color:var(--sub); word-break:break-all; line-height:1.5 }

/* ═══════════════════════════════════════════
   MAIN PANEL
═══════════════════════════════════════════ */
.main { display:flex; flex-direction:column; overflow:hidden }

/* toolbar */
.bar {
  padding:10px 18px; display:flex; gap:8px; align-items:center;
  border-bottom:1px solid var(--border); background:var(--s1); flex-shrink:0;
}
.srch { flex:1; position:relative }
.srch input {
  width:100%; padding:8px 14px 8px 36px; background:var(--s2);
  border:1px solid var(--border); border-radius:10px; color:var(--text);
  font-size:13px; font-family:'Inter',sans-serif; outline:none; transition:.15s;
}
.srch input:focus { border-color:var(--accent) }
.srch input::placeholder { color:var(--muted) }
.srch-ic { position:absolute; left:11px; top:50%; transform:translateY(-50%); font-size:14px; color:var(--muted) }
.tbtn {
  padding:8px 14px; border-radius:10px; background:var(--s2); border:1px solid var(--border);
  color:var(--sub); font-size:12px; cursor:pointer; transition:.15s; white-space:nowrap;
  font-family:'Inter',sans-serif; display:flex; align-items:center; gap:5px;
}
.tbtn:hover { border-color:var(--accent); color:var(--accent) }

/* stats bar */
.stats { display:flex; border-bottom:1px solid var(--border); flex-shrink:0 }
.stat  { flex:1; padding:9px 18px; display:flex; align-items:center; gap:8px; background:var(--s1) }
.stat + .stat { border-left:1px solid var(--border) }
.stat-v { font-family:'Syne',sans-serif; font-size:20px; font-weight:800 }
.stat-l { font-size:11px; color:var(--muted) }
.stat-d { width:7px; height:7px; border-radius:50%; flex-shrink:0 }

/* email list */
.list-wrap { flex:1; overflow-y:auto }
.ei {
  display:grid; grid-template-columns:42px 1fr auto; gap:10px; align-items:start;
  padding:12px 18px; border-bottom:1px solid var(--border); cursor:pointer; transition:.13s;
}
.ei:hover   { background:var(--s2) }
.ei.unread  { background:var(--unread-bg); border-left:3px solid var(--unread-border) }
.ei.sel     { background:var(--s3) }
.e-av { width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-weight:600; font-size:13px; flex-shrink:0 }
.e-body { min-width:0 }
.e-from { font-size:13px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:2px }
.ei:not(.unread) .e-from { color:var(--sub); font-weight:400 }
.e-subj { font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:3px }
.ei.unread .e-subj { color:var(--text); font-weight:500 }
.ei:not(.unread) .e-subj { color:var(--muted) }
.e-prev { font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.e-meta { text-align:right; flex-shrink:0 }
.e-time { font-size:10px; color:var(--muted); margin-bottom:5px }
.e-dot  { width:7px; height:7px; border-radius:50%; background:var(--accent); display:inline-block }

/* empty state */
.empty { padding:60px 20px; text-align:center }
.empty-ic { font-size:44px; margin-bottom:14px; opacity:.4 }
.empty-t  { font-family:'Syne',sans-serif; font-size:18px; margin-bottom:8px }
.empty-s  { font-size:13px; color:var(--muted); line-height:1.7 }

/* pagination */
.pagi {
  padding:10px 18px; display:flex; align-items:center; justify-content:center; gap:5px;
  border-top:1px solid var(--border); background:var(--s1); flex-shrink:0;
}
.pp {
  width:30px; height:30px; border-radius:8px; background:var(--s2);
  border:1px solid var(--border); color:var(--text); cursor:pointer;
  font-size:12px; display:flex; align-items:center; justify-content:center; transition:.13s;
}
.pp:hover, .pp.on { background:var(--accent); border-color:var(--accent); color:#fff }
.pp:disabled { opacity:.3; cursor:default; pointer-events:none }
.pagi-info { font-size:12px; color:var(--muted); padding:0 8px }

/* ═══════════════════════════════════════════
   DETAIL PANEL (right slide-in)
═══════════════════════════════════════════ */
.det {
  position:fixed; top:56px; right:0; width:54vw; max-width:820px;
  height:calc(100vh - 56px); background:var(--s1); border-left:1px solid var(--border2);
  display:none; flex-direction:column; z-index:20; animation:slide-in .2s ease;
}
@keyframes slide-in { from{transform:translateX(24px);opacity:0} to{transform:none;opacity:1} }

.det-hdr {
  padding:16px 20px; border-bottom:1px solid var(--border);
  display:flex; gap:12px; align-items:flex-start; flex-shrink:0;
}
.det-close {
  width:28px; height:28px; border-radius:7px; background:var(--s2); border:1px solid var(--border);
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  color:var(--muted); font-size:14px; flex-shrink:0; transition:.13s;
}
.det-close:hover { border-color:var(--a2); color:var(--a2) }
.det-subj { font-family:'Syne',sans-serif; font-size:16px; font-weight:700; line-height:1.3; margin-bottom:3px }
.det-date { font-size:11px; color:var(--muted) }

.det-meta {
  padding:12px 20px; border-bottom:1px solid var(--border);
  display:flex; gap:10px; background:var(--s2); flex-shrink:0;
}
.det-av  { width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-weight:600; font-size:14px; flex-shrink:0 }
.det-name { font-size:13px; font-weight:500; margin-bottom:2px }
.det-addr { font-size:11px; color:var(--muted) }
.det-to   { font-size:11px; color:var(--muted); margin-top:2px }

.det-acts { padding:8px 20px; border-bottom:1px solid var(--border); display:flex; gap:6px; flex-shrink:0 }
.det-btn {
  padding:5px 12px; border-radius:8px; background:var(--s2); border:1px solid var(--border);
  color:var(--sub); font-size:11px; cursor:pointer; transition:.13s; font-family:'Inter',sans-serif;
}
.det-btn:hover { border-color:var(--accent); color:var(--accent) }

.det-body { flex:1; overflow-y:auto; padding:20px }
.det-body-txt { font-size:13px; line-height:1.9; color:#cccce0; white-space:pre-wrap; word-break:break-word }

/* ═══════════════════════════════════════════
   LOADER
═══════════════════════════════════════════ */
#loader {
  position:fixed; inset:0; background:var(--bg); display:flex;
  align-items:center; justify-content:center; flex-direction:column; gap:14px; z-index:999;
}
.loader-ring {
  width:42px; height:42px; border:2.5px solid var(--border2);
  border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite;
}
@keyframes spin { to{transform:rotate(360deg)} }
.loader-txt { font-size:13px; color:var(--sub) }

/* skeleton loading */
.sk { background:linear-gradient(90deg,var(--s2) 25%,var(--s3) 50%,var(--s2) 75%); background-size:200%; animation:shim 1.1s infinite; border-radius:5px }
@keyframes shim { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
.sk-line { height:11px; margin-bottom:8px }

/* toast */
#toast {
  position:fixed; bottom:20px; right:20px; background:var(--s2); border:1px solid var(--border2);
  border-left:3px solid var(--a3); padding:12px 18px; border-radius:10px;
  font-size:12px; color:var(--text); box-shadow:0 8px 24px #00000066; z-index:9999; display:none;
}
#toast.err { border-left-color:var(--a2) }

/* scrollbar */
::-webkit-scrollbar { width:4px }
::-webkit-scrollbar-track { background:transparent }
::-webkit-scrollbar-thumb { background:var(--border2); border-radius:2px }

/* responsive */
@media(max-width:768px) {
  .layout { grid-template-columns:1fr }
  .sb     { display:none }
  .det    { width:100vw }
  .stats  { display:none }
}
</style>
</head>
<body>

<!-- LOADER -->
<div id="loader">
  <div class="loader-ring"></div>
  <div class="loader-txt" id="loader-txt">Connecting to Zoho Mail...</div>
</div>

<!-- HEADER -->
<div class="hdr">
  <div class="hdr-logo">✉</div>
  <div class="hdr-title">ZohoMail Viewer</div>
  <div class="hdr-space"></div>
  <div class="hdr-badge">
    <span class="live-dot"></span>
    <span id="hdr-email">Loading...</span>
  </div>
</div>

<!-- LAYOUT -->
<div class="layout">

  <!-- SIDEBAR -->
  <div class="sb">
    <div class="sb-label">Folders</div>
    <div id="folder-list"></div>
    <div class="sb-div"></div>
    <div class="sb-foot">
      <div class="sb-foot-lbl">Account</div>
      <div class="sb-foot-em" id="sb-email">—</div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">

    <!-- toolbar -->
    <div class="bar">
      <div class="srch">
        <span class="srch-ic">🔍</span>
        <input type="text" id="search-input" placeholder="Search messages..." oninput="onSearch()">
      </div>
      <button class="tbtn" onclick="refresh()">↻ Refresh</button>
    </div>

    <!-- stats -->
    <div class="stats">
      <div class="stat">
        <div class="stat-d" style="background:var(--accent)"></div>
        <div><div class="stat-v" id="stat-total">—</div><div class="stat-l">Total</div></div>
      </div>
      <div class="stat">
        <div class="stat-d" style="background:var(--a2)"></div>
        <div><div class="stat-v" id="stat-unread">—</div><div class="stat-l">Unread</div></div>
      </div>
      <div class="stat">
        <div class="stat-d" style="background:var(--a3)"></div>
        <div>
          <div class="stat-v" id="stat-folder" style="font-size:13px;padding-top:3px">—</div>
          <div class="stat-l">Folder</div>
        </div>
      </div>
    </div>

    <!-- email list -->
    <div class="list-wrap" id="email-list"></div>
    <div class="pagi" id="pagination"></div>

  </div>
</div>

<!-- DETAIL PANEL -->
<div class="det" id="detail-panel">
  <div class="det-hdr">
    <button class="det-close" onclick="closeDetail()">✕</button>
    <div style="flex:1;min-width:0">
      <div class="det-subj" id="d-subject">—</div>
      <div class="det-date" id="d-date"></div>
    </div>
  </div>
  <div class="det-meta">
    <div class="det-av" id="d-avatar">?</div>
    <div>
      <div class="det-name" id="d-name"></div>
      <div class="det-addr" id="d-from"></div>
      <div class="det-to"   id="d-to"></div>
    </div>
  </div>
  <div class="det-acts">
    <button class="det-btn">↩ Reply</button>
    <button class="det-btn">→ Forward</button>
    <button class="det-btn">⬇ Download</button>
  </div>
  <div class="det-body">
    <div id="d-body" class="det-body-txt"></div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ═══════════════════════════════════════════
   CONFIG
═══════════════════════════════════════════ */
const API      = '/api/emails';
const PER_PAGE = 30; // client-side display pagination

/* ═══════════════════════════════════════════
   STATE
═══════════════════════════════════════════ */
let allEmails  = [];   // all fetched from API
let folderList = [];
let curFolder  = '';
let curPage    = 1;
let searchQ    = '';
let totalCount = 0;    // total in folder (from API)

/* ═══════════════════════════════════════════
   CONSTANTS
═══════════════════════════════════════════ */
const COLORS = ['#7c6ef7','#f76e8a','#4ecca3','#f9a825','#29b6f6','#ab47bc','#ef5350','#26a69a'];
const FOLDER_ICONS = {
  inbox:'📥', sent:'📤', drafts:'📝', spam:'🚫', trash:'🗑️',
  archive:'📦', notification:'🔔', newsletter:'📰',
  templates:'📋', snoozed:'😴', outbox:'📬', starred:'⭐',
};
const FOLDER_ORDER = ['Inbox','Sent','Drafts','Spam','Trash','Templates','Snoozed','Outbox','Notification','Newsletter','Archive'];

/* ═══════════════════════════════════════════
   UTILS
═══════════════════════════════════════════ */
function avatarColor(s) {
  let h = 0;
  for (const c of (s || '')) h = (h * 31 + c.charCodeAt(0)) % COLORS.length;
  return COLORS[h];
}
function initials(s) {
  return (s || '?').split(/[\s@]+/).map(w => w[0]).join('').toUpperCase().slice(0, 2) || '?';
}
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function decodeHtml(s) {
  const t = document.createElement('textarea');
  t.innerHTML = s || '';
  return t.value;
}
function fmtTime(ms) {
  if (!ms) return '';
  const d = new Date(Number(ms)), n = new Date();
  if (d.toDateString() === n.toDateString()) return d.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
  if (n - d < 7 * 864e5) return d.toLocaleDateString([], { weekday:'short' });
  return d.toLocaleDateString([], { month:'short', day:'numeric' });
}
function fmtFull(ms) {
  if (!ms) return '';
  return new Date(Number(ms)).toLocaleString([], { dateStyle:'medium', timeStyle:'short' });
}
function parseName(fromAddr) {
  if (!fromAddr) return '';
  if (fromAddr.includes('<')) return fromAddr.split('<')[0].trim().replace(/"/g, '');
  return fromAddr.split('@')[0];
}

/* ═══════════════════════════════════════════
   LOADER / TOAST
═══════════════════════════════════════════ */
function showLoader(msg) {
  document.getElementById('loader').style.display = 'flex';
  document.getElementById('loader-txt').textContent = msg || 'Loading...';
}
function hideLoader() {
  document.getElementById('loader').style.display = 'none';
}
function showToast(msg, isErr = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = isErr ? 'err' : '';
  t.style.display = 'block';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.style.display = 'none', 4000);
}

/* ═══════════════════════════════════════════
   LOAD EMAILS
═══════════════════════════════════════════ */
async function loadEmails(folder = '') {
  showLoader(`Loading ${folder || 'emails'}...`);
  closeDetail();
  try {
    const url = folder
      ? `${API}?folder=${encodeURIComponent(folder)}&limit=200`
      : `${API}?limit=200`;

    const r = await fetch(url);
    const d = await r.json();

    if (d.error) throw new Error(d.error);

    allEmails  = Array.isArray(d.emails)  ? d.emails  : [];
    folderList = Array.isArray(d.folders) ? d.folders : [];
    curFolder  = d.activeFolder || folder || '';
    totalCount = d.total || allEmails.length;

    // Update header + sidebar
    const email = d.accountEmail || '';
    document.getElementById('hdr-email').textContent = email || 'Connected';
    document.getElementById('sb-email').textContent  = email;

    // Update stats
    document.getElementById('stat-total').textContent  = totalCount;
    document.getElementById('stat-unread').textContent = allEmails.filter(m => m.status === '0').length;
    document.getElementById('stat-folder').textContent = curFolder;

    renderFolders();

    // Reset UI
    curPage = 1;
    searchQ = '';
    document.getElementById('search-input').value = '';
    renderList();
    hideLoader();

  } catch (err) {
    hideLoader();
    document.getElementById('email-list').innerHTML = `
      <div class="empty">
        <div class="empty-ic">⚠️</div>
        <div class="empty-t">Failed to load</div>
        <div class="empty-s">${esc(err.message)}<br><br>
          Check Vercel → Logs for details.<br>
          Or visit <strong>/api/emails</strong> directly to debug.
        </div>
      </div>`;
    showToast(err.message, true);
  }
}

/* ═══════════════════════════════════════════
   RENDER FOLDERS
═══════════════════════════════════════════ */
function renderFolders() {
  const map = {};
  folderList.forEach(f => map[f.name] = f);

  const sorted = [];
  FOLDER_ORDER.forEach(n => { if (map[n]) sorted.push(map[n]); });
  folderList.forEach(f => { if (!FOLDER_ORDER.includes(f.name)) sorted.push(f); });

  document.getElementById('folder-list').innerHTML = sorted.map(f => {
    const ic  = FOLDER_ICONS[f.name.toLowerCase()] || '📁';
    const on  = f.name === curFolder ? 'on' : '';
    const cnt = f.unread || 0;
    return `<div class="fi ${on}" onclick="switchFolder('${esc(f.name)}', this)">
      <span class="ic">${ic}</span>
      <span class="nm">${esc(f.name)}</span>
      <span class="ct ${cnt === 0 ? 'z' : ''}">${cnt}</span>
    </div>`;
  }).join('');
}

function switchFolder(name, el) {
  document.querySelectorAll('.fi').forEach(f => f.classList.remove('on'));
  el.classList.add('on');
  loadEmails(name);
}

/* ═══════════════════════════════════════════
   RENDER EMAIL LIST
═══════════════════════════════════════════ */
function getFiltered() {
  if (!searchQ) return allEmails;
  const q = searchQ.toLowerCase();
  return allEmails.filter(m =>
    decodeHtml(m.subject || '').toLowerCase().includes(q) ||
    (m.fromAddress || m.sender || '').toLowerCase().includes(q) ||
    (m.summary || '').toLowerCase().includes(q)
  );
}

function renderList() {
  const filtered = getFiltered();
  const total    = filtered.length;
  const start    = (curPage - 1) * PER_PAGE;
  const page     = filtered.slice(start, start + PER_PAGE);
  const listEl   = document.getElementById('email-list');

  if (!page.length) {
    listEl.innerHTML = `
      <div class="empty">
        <div class="empty-ic">📭</div>
        <div class="empty-t">No messages</div>
        <div class="empty-s">${searchQ ? 'Try different keywords' : 'This folder is empty'}</div>
      </div>`;
    document.getElementById('pagination').innerHTML = '';
    return;
  }

  listEl.innerHTML = page.map((m, i) => {
    const from   = m.fromAddress || m.sender || '';
    const name   = parseName(from);
    const color  = avatarColor(from);
    const unread = m.status === '0';
    const subj   = decodeHtml(m.subject || '(No Subject)');
    const idx    = start + i;
    return `<div class="ei ${unread ? 'unread' : ''}" onclick="openEmail(${idx}, this)">
      <div class="e-av" style="background:${color}18;color:${color}">${initials(name || from)}</div>
      <div class="e-body">
        <div class="e-from">${esc(name || from || 'Unknown')}</div>
        <div class="e-subj">${esc(subj)}</div>
        <div class="e-prev">${esc(m.summary || '')}</div>
      </div>
      <div class="e-meta">
        <div class="e-time">${fmtTime(m.receivedTime || m.sentDateInGMT)}</div>
        ${unread ? '<span class="e-dot"></span>' : ''}
      </div>
    </div>`;
  }).join('');

  renderPagination(total);
}

function renderPagination(total) {
  const el    = document.getElementById('pagination');
  const pages = Math.ceil(total / PER_PAGE);
  if (pages <= 1) { el.innerHTML = ''; return; }

  let html = `<button class="pp" onclick="goPage(${curPage - 1})" ${curPage === 1 ? 'disabled' : ''}>‹</button>`;

  const MAX_BTNS = 7;
  let s = Math.max(1, curPage - 3);
  let e = Math.min(pages, s + MAX_BTNS - 1);
  if (e - s < MAX_BTNS - 1) s = Math.max(1, e - MAX_BTNS + 1);

  if (s > 1) html += `<button class="pp" onclick="goPage(1)">1</button><span class="pagi-info">…</span>`;
  for (let i = s; i <= e; i++) html += `<button class="pp ${i === curPage ? 'on' : ''}" onclick="goPage(${i})">${i}</button>`;
  if (e < pages) html += `<span class="pagi-info">…</span><button class="pp" onclick="goPage(${pages})">${pages}</button>`;

  html += `<button class="pp" onclick="goPage(${curPage + 1})" ${curPage === pages ? 'disabled' : ''}>›</button>`;
  html += `<span class="pagi-info">${total} messages</span>`;
  el.innerHTML = html;
}

function goPage(n) {
  const pages = Math.ceil(getFiltered().length / PER_PAGE);
  if (n < 1 || n > pages) return;
  curPage = n;
  renderList();
  document.querySelector('.list-wrap').scrollTop = 0;
}

function onSearch() {
  searchQ = document.getElementById('search-input').value;
  curPage = 1;
  renderList();
}

function refresh() { loadEmails(curFolder); }

/* ═══════════════════════════════════════════
   OPEN EMAIL DETAIL
═══════════════════════════════════════════ */
async function openEmail(idx, el) {
  const filtered = getFiltered();
  const m = filtered[idx];
  if (!m) return;

  // UI update
  document.querySelectorAll('.ei').forEach(e => e.classList.remove('sel'));
  el.classList.add('sel');
  el.classList.remove('unread');
  document.getElementById('detail-panel').style.display = 'flex';

  // Fill header info immediately (from list data)
  const from  = m.fromAddress || m.sender || '';
  const name  = parseName(from);
  const color = avatarColor(from);

  document.getElementById('d-subject').textContent = decodeHtml(m.subject || '(No Subject)');
  document.getElementById('d-date').textContent    = fmtFull(m.receivedTime || m.sentDateInGMT);

  const av = document.getElementById('d-avatar');
  av.textContent = initials(name || from);
  av.style.cssText = `background:${color}18;color:${color};width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;flex-shrink:0`;

  document.getElementById('d-name').textContent = name || from;
  document.getElementById('d-from').textContent = from;
  document.getElementById('d-to').textContent   = 'To: ' + decodeHtml(m.toAddress || '');

  // Skeleton while loading body
  const bodyEl = document.getElementById('d-body');
  bodyEl.innerHTML = `
    <div class="sk sk-line" style="width:90%"></div>
    <div class="sk sk-line" style="width:75%"></div>
    <div class="sk sk-line" style="width:83%"></div>
    <div class="sk sk-line" style="width:60%;margin-top:16px"></div>
    <div class="sk sk-line" style="width:78%"></div>
    <div class="sk sk-line" style="width:70%"></div>`;

  // Fetch full message
  const mid = m.messageId || m.mid || '';
  if (!mid) {
    bodyEl.textContent = m.summary || '(No message ID — cannot fetch body)';
    return;
  }

  try {
    const r = await fetch(`${API}?msgId=${encodeURIComponent(mid)}`);
    const d = await r.json();
    const msg = d.message || d;

    if (msg.htmlBody) {
      // Render HTML in sandboxed iframe
      const iframe = document.createElement('iframe');
      iframe.style.cssText = 'width:100%;border:none;min-height:400px;background:#fff;border-radius:10px';
      iframe.srcdoc = msg.htmlBody;
      bodyEl.innerHTML = '';
      bodyEl.appendChild(iframe);
      iframe.onload = () => {
        try { iframe.style.height = iframe.contentDocument.body.scrollHeight + 40 + 'px'; } catch(e) {}
      };
    } else {
      bodyEl.textContent = msg.content || msg.body || m.summary || '(Empty message)';
    }
  } catch (err) {
    bodyEl.textContent = m.summary || 'Error loading body: ' + err.message;
  }
}

function closeDetail() {
  document.getElementById('detail-panel').style.display = 'none';
  document.querySelectorAll('.ei').forEach(e => e.classList.remove('sel'));
}
