<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZohoMail Viewer</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#080810;--s1:#0e0e1c;--s2:#14142a;--s3:#1a1a35;
  --border:#ffffff0a;--border2:#ffffff14;
  --accent:#7c6ef7;--a2:#f76e8a;--a3:#4ecca3;
  --text:#e2e2f0;--sub:#8888a8;--muted:#4a4a6a;
  --unread:#7c6ef712;--unread-b:#7c6ef7;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif}
body::before{content:'';position:fixed;top:-250px;left:-150px;width:600px;height:600px;background:radial-gradient(circle,#7c6ef70d,transparent 65%);pointer-events:none;z-index:0}
body::after{content:'';position:fixed;bottom:-250px;right:-150px;width:500px;height:500px;background:radial-gradient(circle,#f76e8a0a,transparent 65%);pointer-events:none;z-index:0}

.hdr{height:56px;display:flex;align-items:center;gap:12px;padding:0 20px;background:#080810cc;backdrop-filter:blur(16px);border-bottom:1px solid var(--border2);position:relative;z-index:10;flex-shrink:0}
.hdr-logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--a2));display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.hdr-title{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;background:linear-gradient(90deg,var(--text),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hdr-space{flex:1}
.hdr-badge{display:flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;background:var(--s2);border:1px solid var(--border2);font-size:12px;color:var(--sub)}
.dot-live{width:6px;height:6px;border-radius:50%;background:var(--a3);box-shadow:0 0 5px var(--a3);animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

.layout{flex:1;display:grid;grid-template-columns:220px 1fr;overflow:hidden;position:relative;z-index:1;height:calc(100vh - 56px)}

.sb{background:var(--s1);border-right:1px solid var(--border);overflow-y:auto;display:flex;flex-direction:column;padding:8px 0}
.sb-label{padding:10px 14px 4px;font-size:10px;font-weight:600;letter-spacing:1.8px;color:var(--muted);text-transform:uppercase}
.fi{display:flex;align-items:center;gap:9px;padding:9px 12px;cursor:pointer;border-left:3px solid transparent;transition:.15s;margin:1px 6px 1px 0;border-radius:0 8px 8px 0}
.fi:hover{background:var(--s2)}
.fi.on{background:var(--unread);border-left-color:var(--accent);color:var(--accent)}
.fi .ic{font-size:14px;flex-shrink:0;width:18px;text-align:center}
.fi .nm{flex:1;font-size:13px}
.fi .ct{font-size:11px;font-weight:600;padding:1px 7px;border-radius:20px;background:var(--accent);color:#fff;min-width:20px;text-align:center}
.fi .ct.z{background:var(--s3);color:var(--muted)}
.sb-div{height:1px;background:var(--border);margin:8px 12px}
.sb-bottom{margin-top:auto;padding:12px 14px;border-top:1px solid var(--border)}
.sb-email-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:3px}
.sb-email{font-size:11px;color:var(--sub);word-break:break-all;line-height:1.5}

.main{display:flex;flex-direction:column;overflow:hidden}
.bar{padding:10px 16px;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--border);background:var(--s1);flex-shrink:0}
.srch{flex:1;position:relative}
.srch input{width:100%;padding:8px 12px 8px 34px;background:var(--s2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:13px;font-family:'Inter',sans-serif;outline:none;transition:.15s}
.srch input:focus{border-color:var(--accent)}
.srch input::placeholder{color:var(--muted)}
.srch-ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--muted)}
.tbtn{padding:8px 13px;border-radius:10px;background:var(--s2);border:1px solid var(--border);color:var(--sub);font-size:12px;cursor:pointer;transition:.15s;white-space:nowrap;font-family:'Inter',sans-serif}
.tbtn:hover{border-color:var(--accent);color:var(--accent)}

.stats{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
.stat{flex:1;padding:9px 16px;display:flex;align-items:center;gap:8px;background:var(--s1)}
.stat+.stat{border-left:1px solid var(--border)}
.stat-v{font-family:'Syne',sans-serif;font-size:20px;font-weight:800}
.stat-l{font-size:11px;color:var(--muted)}
.sd{width:7px;height:7px;border-radius:50%;flex-shrink:0}

.list-wrap{flex:1;overflow-y:auto}
.ei{display:grid;grid-template-columns:40px 1fr auto;gap:9px;align-items:start;padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:.13s}
.ei:hover{background:var(--s2)}
.ei.unread{background:var(--unread);border-left:3px solid var(--unread-b)}
.ei.sel{background:var(--s3)}
.eav{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;flex-shrink:0}
.eb{min-width:0}
.efr{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.ei:not(.unread) .efr{color:var(--sub);font-weight:400}
.esj{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.ei.unread .esj{color:var(--text);font-weight:500}
.ei:not(.unread) .esj{color:var(--muted)}
.epv{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.em{text-align:right;flex-shrink:0}
.et{font-size:10px;color:var(--muted);margin-bottom:4px}
.eu{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block}

.empty{padding:60px 20px;text-align:center}
.empty-ic{font-size:40px;margin-bottom:12px;opacity:.4}
.empty-t{font-family:'Syne',sans-serif;font-size:17px;margin-bottom:6px}
.empty-s{font-size:13px;color:var(--muted);line-height:1.6}

.pagi{padding:10px 16px;display:flex;align-items:center;justify-content:center;gap:5px;border-top:1px solid var(--border);background:var(--s1);flex-shrink:0}
.pp{width:30px;height:30px;border-radius:8px;background:var(--s2);border:1px solid var(--border);color:var(--text);cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;transition:.13s}
.pp:hover,.pp.on{background:var(--accent);border-color:var(--accent);color:#fff}
.pp:disabled{opacity:.3;cursor:default;pointer-events:none}
.pi{font-size:12px;color:var(--muted);padding:0 6px}

/* DETAIL */
.det{position:fixed;top:56px;right:0;width:54vw;max-width:820px;height:calc(100vh - 56px);background:var(--s1);border-left:1px solid var(--border2);display:none;flex-direction:column;z-index:20;animation:si .2s ease}
@keyframes si{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.dh{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:flex-start;flex-shrink:0}
.dcl{width:28px;height:28px;border-radius:7px;background:var(--s2);border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;flex-shrink:0;transition:.13s}
.dcl:hover{border-color:var(--a2);color:var(--a2)}
.dsj{font-family:'Syne',sans-serif;font-size:16px;font-weight:700;line-height:1.3;margin-bottom:2px}
.ddt{font-size:11px;color:var(--muted)}
.dme{padding:12px 20px;border-bottom:1px solid var(--border);display:flex;gap:10px;background:var(--s2);flex-shrink:0}
.dav{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;flex-shrink:0}
.dfn{font-size:13px;font-weight:500;margin-bottom:2px}
.dfe{font-size:11px;color:var(--muted)}
.dto{font-size:11px;color:var(--muted);margin-top:1px}
.dac{padding:8px 20px;border-bottom:1px solid var(--border);display:flex;gap:6px;flex-wrap:wrap;flex-shrink:0}
.dab{padding:5px 11px;border-radius:8px;background:var(--s2);border:1px solid var(--border);color:var(--sub);font-size:11px;cursor:pointer;transition:.13s;font-family:'Inter',sans-serif}
.dab:hover{border-color:var(--accent);color:var(--accent)}
.dbody{flex:1;overflow-y:auto;padding:20px}
.dbody-txt{font-size:13px;line-height:1.9;color:#cccce0;white-space:pre-wrap;word-break:break-word}

/* LOADER */
#ldr{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:999}
.ring{width:40px;height:40px;border:2.5px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ldt{font-size:13px;color:var(--sub)}

/* SKELETON */
.sk{background:linear-gradient(90deg,var(--s2) 25%,var(--s3) 50%,var(--s2) 75%);background-size:200%;animation:shim 1.1s infinite;border-radius:5px}
@keyframes shim{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skl{height:10px;margin-bottom:7px}

#toast{position:fixed;bottom:18px;right:18px;background:var(--s2);border:1px solid var(--border2);border-left:3px solid var(--a3);padding:11px 16px;border-radius:10px;font-size:12px;color:var(--text);box-shadow:0 8px 24px #00000055;z-index:9999;display:none}
#toast.err{border-left-color:var(--a2)}

::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
@media(max-width:700px){.layout{grid-template-columns:1fr}.sb{display:none}.det{width:100vw}.stats{display:none}}
</style>
</head>
<body>

<div id="ldr"><div class="ring"></div><div class="ldt" id="ldt">Connecting to Zoho Mail...</div></div>

<div class="hdr">
  <div class="hdr-logo">✉</div>
  <div class="hdr-title">ZohoMail Viewer</div>
  <div class="hdr-space"></div>
  <div class="hdr-badge"><span class="dot-live"></span><span id="hdr-em">Loading...</span></div>
</div>

<div class="layout">
  <div class="sb">
    <div class="sb-label">Folders</div>
    <div id="fl"></div>
    <div class="sb-div"></div>
    <div class="sb-bottom">
      <div class="sb-email-label">Account</div>
      <div class="sb-email" id="sb-em">—</div>
    </div>
  </div>

  <div class="main">
    <div class="bar">
      <div class="srch">
        <span class="srch-ic">🔍</span>
        <input type="text" id="srch" placeholder="Search messages..." oninput="doSearch()">
      </div>
      <button class="tbtn" onclick="refresh()">↻ Refresh</button>
    </div>
    <div class="stats">
      <div class="stat"><div class="sd" style="background:var(--accent)"></div><div><div class="stat-v" id="sv-t">—</div><div class="stat-l">Total</div></div></div>
      <div class="stat"><div class="sd" style="background:var(--a2)"></div><div><div class="stat-v" id="sv-u">—</div><div class="stat-l">Unread</div></div></div>
      <div class="stat"><div class="sd" style="background:var(--a3)"></div><div><div class="stat-v" id="sv-f" style="font-size:13px;padding-top:3px">Inbox</div><div class="stat-l">Folder</div></div></div>
    </div>
    <div class="list-wrap" id="list"></div>
    <div class="pagi" id="pagi"></div>
  </div>
</div>

<div class="det" id="det">
  <div class="dh">
    <button class="dcl" onclick="closeDet()">✕</button>
    <div style="flex:1;min-width:0"><div class="dsj" id="d-sj">—</div><div class="ddt" id="d-dt"></div></div>
  </div>
  <div class="dme">
    <div class="dav" id="d-av">?</div>
    <div><div class="dfn" id="d-fn"></div><div class="dfe" id="d-fe"></div><div class="dto" id="d-to"></div></div>
  </div>
  <div class="dac">
    <button class="dab">↩ Reply</button>
    <button class="dab">→ Forward</button>
    <button class="dab">⬇ Download</button>
  </div>
  <div class="dbody" id="d-body"><div id="d-bd" class="dbody-txt"></div></div>
</div>

<div id="toast"></div>

<script>
const API = '/api/emails';
const COLORS = ['#7c6ef7','#f76e8a','#4ecca3','#f9a825','#29b6f6','#ab47bc','#ef5350','#26a69a'];
const FOLDER_ICONS = {inbox:'📥',sent:'📤',drafts:'📝',spam:'🚫',trash:'🗑️',starred:'⭐',archive:'📦',notification:'🔔',newsletter:'📰',templates:'📋',snoozed:'😴',outbox:'📬'};

let emails=[], filtered=[], folderList=[], curMsgData=[];
let curFolder='Inbox', curPage=1;
const PER=30;

// Decode HTML entities
function decodeHtml(s) {
  const txt = document.createElement('textarea');
  txt.innerHTML = s || '';
  return txt.value;
}

function col(s){let h=0;for(let c of(s||''))h=(h*31+c.charCodeAt(0))%COLORS.length;return COLORS[h]}
function ini(s){return(s||'?').split(/[\s@]+/).map(w=>w[0]).join('').toUpperCase().slice(0,2)||'?'}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function fmtT(ms){
  if(!ms)return'';
  const d=new Date(Number(ms)),n=new Date();
  if(d.toDateString()===n.toDateString())return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  if(n-d<7*864e5)return d.toLocaleDateString([],{weekday:'short'});
  return d.toLocaleDateString([],{month:'short',day:'numeric'});
}
function fmtF(ms){if(!ms)return'';return new Date(Number(ms)).toLocaleString([],{dateStyle:'medium',timeStyle:'short'})}

function setLoad(show,msg){
  document.getElementById('ldr').style.display=show?'flex':'none';
  if(msg)document.getElementById('ldt').textContent=msg;
}
function toast(msg,err=false){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className=err?'err':'';t.style.display='block';
  clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',4000);
}

async function loadEmails(folder='Inbox'){
  setLoad(true,`Loading ${folder}...`);
  curFolder=folder;
  document.getElementById('sv-f').textContent=folder;
  closeDet();
  try{
    const r=await fetch(`${API}?folder=${encodeURIComponent(folder)}&limit=200`);
    const d=await r.json();
    if(d.error)throw new Error(d.error);
    emails=Array.isArray(d.emails)?d.emails:[];
    folderList=Array.isArray(d.folders)?d.folders:[];
    // Use activeFolder from API if available
    if(d.activeFolder) curFolder=d.activeFolder;
    document.getElementById('sv-f').textContent=curFolder;
    const em=d.accountEmail||'';
    document.getElementById('hdr-em').textContent=em||'Connected';
    document.getElementById('sb-em').textContent=em;
    const unread=emails.filter(m=>m.status==='0').length;
    document.getElementById('sv-t').textContent=emails.length;
    document.getElementById('sv-u').textContent=unread;
    renderFolders();
    curPage=1;filtered=[...emails];
    renderList();
    setLoad(false);
  }catch(e){
    setLoad(false);
    document.getElementById('list').innerHTML=`<div class="empty"><div class="empty-ic">⚠️</div><div class="empty-t">Failed to load</div><div class="empty-s">${esc(e.message)}</div></div>`;
    toast(e.message,true);
  }
}

function renderFolders(){
  const defaults=['Inbox','Sent','Drafts','Spam','Trash','Templates','Snoozed','Outbox','Notification','Newsletter','Archive'];
  const map={};
  folderList.forEach(f=>map[f.name.toLowerCase()]=f);
  const all=[];
  defaults.forEach(n=>{if(map[n.toLowerCase()])all.push(map[n.toLowerCase()])});
  folderList.forEach(f=>{if(!defaults.map(d=>d.toLowerCase()).includes(f.name.toLowerCase()))all.push(f)});
  document.getElementById('fl').innerHTML=all.map(f=>{
    const ic=FOLDER_ICONS[f.name.toLowerCase()]||'📁';
    const on=f.name.toLowerCase()===curFolder.toLowerCase()?'on':'';
    const u=f.unread||0;
    return`<div class="fi ${on}" onclick="switchFolder('${esc(f.name)}',this)">
      <span class="ic">${ic}</span><span class="nm">${esc(f.name)}</span>
      <span class="ct ${u===0?'z':''}">${u}</span></div>`;
  }).join('');
}

function switchFolder(name,el){
  document.querySelectorAll('.fi').forEach(f=>f.classList.remove('on'));
  el.classList.add('on');
  loadEmails(name);
}

function renderList(){
  const q=document.getElementById('srch').value.toLowerCase();
  filtered=emails.filter(m=>{
    if(!q)return true;
    const subj=decodeHtml(m.subject||'').toLowerCase();
    const from=(m.fromAddress||m.sender||'').toLowerCase();
    const prev=(m.summary||'').toLowerCase();
    return subj.includes(q)||from.includes(q)||prev.includes(q);
  });
  const total=filtered.length;
  const sl=(curPage-1)*PER;
  const page=filtered.slice(sl,sl+PER);
  const list=document.getElementById('list');
  if(!page.length){
    list.innerHTML=`<div class="empty"><div class="empty-ic">📭</div><div class="empty-t">No messages</div><div class="empty-s">${q?'Try different keywords':'This folder is empty'}</div></div>`;
    document.getElementById('pagi').innerHTML='';return;
  }
  list.innerHTML=page.map((m,i)=>{
    const from=m.fromAddress||m.sender||'';
    const name=from.includes('<')?from.split('<')[0].trim().replace(/"/g,''):from.split('@')[0];
    const c=col(from);
    const unread=m.status==='0';
    const subj=decodeHtml(m.subject||'(No Subject)');
    const idx=sl+i;
    return`<div class="ei ${unread?'unread':''}" onclick="openMsg(${idx},this)">
      <div class="eav" style="background:${c}18;color:${c}">${ini(name||from)}</div>
      <div class="eb">
        <div class="efr">${esc(name||from||'Unknown')}</div>
        <div class="esj">${esc(subj)}</div>
        <div class="epv">${esc(m.summary||'')}</div>
      </div>
      <div class="em"><div class="et">${fmtT(m.receivedTime||m.sentDateInGMT)}</div>${unread?'<span class="eu"></span>':''}</div>
    </div>`;
  }).join('');
  renderPagi(total);
}

function renderPagi(total){
  const p=document.getElementById('pagi');
  const pages=Math.ceil(total/PER);
  if(pages<=1){p.innerHTML='';return}
  let h=`<button class="pp" onclick="goPage(${curPage-1})" ${curPage===1?'disabled':''}>‹</button>`;
  for(let i=1;i<=Math.min(pages,7);i++)h+=`<button class="pp ${i===curPage?'on':''}" onclick="goPage(${i})">${i}</button>`;
  if(pages>7)h+=`<span class="pi">…${pages}</span>`;
  h+=`<button class="pp" onclick="goPage(${curPage+1})" ${curPage===pages?'disabled':''}>›</button>`;
  h+=`<span class="pi">${total} msgs</span>`;
  p.innerHTML=h;
}

function goPage(n){
  const pages=Math.ceil(filtered.length/PER);
  if(n<1||n>pages)return;
  curPage=n;renderList();
  document.querySelector('.list-wrap').scrollTop=0;
}
function doSearch(){curPage=1;renderList()}

// Open email using data we already have + fetch full body
async function openMsg(idx, el){
  const m = filtered[idx];
  if(!m) return;

  document.querySelectorAll('.ei').forEach(e=>e.classList.remove('sel'));
  el.classList.add('sel');
  el.classList.remove('unread');

  const det=document.getElementById('det');
  det.style.display='flex';

  const from=m.fromAddress||m.sender||'';
  const name=from.includes('<')?from.split('<')[0].trim().replace(/"/g,''):from.split('@')[0];
  const c=col(from);
  const subj=decodeHtml(m.subject||'(No Subject)');

  // Show info immediately from list data
  document.getElementById('d-sj').textContent=subj;
  document.getElementById('d-dt').textContent=fmtF(m.receivedTime||m.sentDateInGMT);
  const av=document.getElementById('d-av');
  av.textContent=ini(name||from);
  av.style.cssText=`background:${c}18;color:${c};width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;flex-shrink:0`;
  document.getElementById('d-fn').textContent=name||from;
  document.getElementById('d-fe').textContent=from;
  document.getElementById('d-to').textContent='To: '+decodeHtml(m.toAddress||'');

  // Show preview while loading full body
  const bd=document.getElementById('d-bd');
  bd.innerHTML=`<div class="sk skl" style="width:88%"></div><div class="sk skl" style="width:72%"></div><div class="sk skl" style="width:80%"></div><div class="sk skl" style="width:55%;margin-top:14px"></div><div class="sk skl" style="width:76%"></div>`;

  // Fetch full message body
  const mid=m.messageId||m.mid||'';
  if(!mid){
    bd.textContent=m.summary||'(No message ID available)';
    return;
  }

  try{
    const r=await fetch(`${API}?msgId=${encodeURIComponent(mid)}`);
    const d=await r.json();
    const msg=d.message||d;
    if(msg.htmlBody){
      const fr=document.createElement('iframe');
      fr.style.cssText='width:100%;border:none;min-height:400px;background:#fff;border-radius:8px';
      fr.srcdoc=msg.htmlBody;
      bd.innerHTML='';bd.appendChild(fr);
      fr.onload=()=>{try{fr.style.height=fr.contentDocument.body.scrollHeight+40+'px'}catch(e){}};
    } else if(msg.content||msg.body){
      bd.textContent=msg.content||msg.body;
    } else {
      // Fallback: show summary from list
      bd.textContent=m.summary||'(Content unavailable)';
    }
  }catch(e){
    bd.textContent=m.summary||'Error loading: '+e.message;
  }
}

function closeDet(){
  document.getElementById('det').style.display='none';
  document.querySelectorAll('.ei').forEach(e=>e.classList.remove('sel'));
}
function refresh(){loadEmails(curFolder)}

loadEmails('');
</script>
