<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZohoMail Viewer</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#05050f;--s1:#0c0c1e;--s2:#111128;--s3:#181835;--s4:#1e1e40;--b1:rgba(255,255,255,0.06);--b2:rgba(255,255,255,0.10);--b3:rgba(255,255,255,0.15);--p:#7B6EF6;--p2:#9B8EFF;--pd:rgba(123,110,246,0.12);--pink:#F06292;--teal:#4ECDC4;--amber:#FFB347;--text:#EEEEF8;--sub:#9090B0;--muted:#4A4A6A}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text)}
.glow{position:fixed;pointer-events:none;border-radius:50%;filter:blur(80px);opacity:.4}
.g1{width:500px;height:500px;top:-200px;left:-150px;background:#7B6EF620;z-index:0}
.g2{width:400px;height:400px;bottom:-200px;right:-100px;background:#F0629215;z-index:0}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--b2);border-radius:2px}

/* HEADER */
.hdr{position:relative;z-index:20;height:58px;display:flex;align-items:center;padding:0 20px;gap:14px;background:rgba(5,5,15,.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--b1);flex-shrink:0}
.logo{width:34px;height:34px;border-radius:10px;flex-shrink:0;background:linear-gradient(135deg,var(--p),var(--pink));display:flex;align-items:center;justify-content:center;font-size:17px;box-shadow:0 0 20px rgba(123,110,246,.4)}
.logo-text{font-family:'Syne',sans-serif;font-size:17px;font-weight:800;background:linear-gradient(90deg,#fff 30%,var(--p2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:10px}
.pill{display:flex;align-items:center;gap:7px;padding:5px 14px;background:var(--s2);border:1px solid var(--b2);border-radius:20px;font-size:12px;color:var(--sub)}
.pulse{width:6px;height:6px;border-radius:50%;background:var(--teal);box-shadow:0 0 8px var(--teal);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.85)}}

/* LAYOUT */
.app{display:grid;grid-template-columns:240px 1fr;height:calc(100vh - 58px);overflow:hidden;position:relative;z-index:1}

/* SIDEBAR */
.sb{background:var(--s1);border-right:1px solid var(--b1);display:flex;flex-direction:column;overflow:hidden}
.sb-body{flex:1;overflow-y:auto;padding:12px 8px}
.sb-sec{font-size:10px;font-weight:700;letter-spacing:2px;color:var(--muted);text-transform:uppercase;padding:4px 10px 8px}
.fi{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;cursor:pointer;transition:all .15s;border:1px solid transparent;margin-bottom:2px}
.fi:hover{background:var(--s2);border-color:var(--b1)}
.fi.on{background:var(--pd);border-color:rgba(123,110,246,.25)}
.fi.on .fi-nm{color:var(--p2)}
.fi-ic{font-size:15px;width:20px;text-align:center;flex-shrink:0}
.fi-nm{flex:1;font-size:13px;font-weight:500}
.fi-ct{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--p);color:#fff;min-width:22px;text-align:center}
.fi-ct.z{background:var(--s3);color:var(--muted)}
.sb-div{height:1px;background:var(--b1);margin:8px 12px}
.sb-ft{padding:14px 16px;border-top:1px solid var(--b1);flex-shrink:0}
.sb-ft-l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.sb-ft-e{font-size:12px;color:var(--sub);word-break:break-all;line-height:1.5}

/* MAIN */
.main{display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}

/* toolbar */
.bar{padding:12px 20px;display:flex;gap:10px;align-items:center;background:var(--s1);border-bottom:1px solid var(--b1);flex-shrink:0}
.srch{flex:1;display:flex;align-items:center;gap:10px;background:var(--s2);border:1px solid var(--b1);border-radius:10px;padding:9px 14px;transition:.15s}
.srch:focus-within{border-color:var(--p)}
.srch input{flex:1;background:transparent;border:none;color:var(--text);font-size:13px;font-family:inherit;outline:none}
.srch input::placeholder{color:var(--muted)}
.btn{padding:9px 16px;border-radius:10px;background:var(--s2);border:1px solid var(--b1);color:var(--sub);font-size:12px;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap;font-family:inherit}
.btn:hover{border-color:var(--p);color:var(--p2)}

/* stats */
.stats{display:flex;border-bottom:1px solid var(--b1);flex-shrink:0}
.stat{flex:1;padding:10px 20px;display:flex;align-items:center;gap:10px;background:var(--s1)}
.stat+.stat{border-left:1px solid var(--b1)}
.stat-d{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.stat-v{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;line-height:1}
.stat-l{font-size:11px;color:var(--muted);margin-top:2px}

/* email list */
.list{flex:1;overflow-y:auto}
.ei{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:start;padding:14px 20px;border-bottom:1px solid var(--b1);cursor:pointer;transition:background .12s;position:relative}
.ei:hover{background:var(--s1)}
.ei.unread{background:rgba(123,110,246,.05)}
.ei.unread::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--p);border-radius:0 2px 2px 0}
.ei.sel{background:var(--s2)}
.e-av{width:42px;height:42px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.e-bd{min-width:0}
.e-fr{font-size:13px;font-weight:600;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ei:not(.unread) .e-fr{font-weight:400;color:var(--sub)}
.e-sj{font-size:12.5px;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ei.unread .e-sj{color:var(--text);font-weight:600}
.ei:not(.unread) .e-sj{color:var(--muted)}
.e-pv{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.e-rt{text-align:right;flex-shrink:0;padding-top:2px}
.e-tm{font-size:11px;color:var(--muted);margin-bottom:6px}
.e-dot{width:7px;height:7px;border-radius:50%;background:var(--p);display:inline-block;box-shadow:0 0 6px var(--p)}

/* empty */
.empty{padding:80px 20px;text-align:center}
.empty-ic{font-size:48px;margin-bottom:16px;opacity:.3}
.empty-t{font-family:'Syne',sans-serif;font-size:20px;margin-bottom:8px}
.empty-s{font-size:13px;color:var(--muted);line-height:1.7}

/* pager */
.pager{padding:12px 20px;display:flex;align-items:center;justify-content:center;gap:6px;border-top:1px solid var(--b1);background:var(--s1);flex-shrink:0}
.pb{width:32px;height:32px;border-radius:8px;background:var(--s2);border:1px solid var(--b1);color:var(--text);cursor:pointer;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;transition:.13s}
.pb:hover,.pb.on{background:var(--p);border-color:var(--p);color:#fff}
.pb:disabled{opacity:.3;cursor:default;pointer-events:none}
.pinfo{font-size:12px;color:var(--muted);padding:0 8px}

/* DETAIL PANEL */
.det{position:fixed;top:58px;right:0;width:52vw;max-width:800px;height:calc(100vh - 58px);background:var(--s1);border-left:1px solid var(--b2);display:none;flex-direction:column;z-index:30;animation:si .22s cubic-bezier(.16,1,.3,1)}
@keyframes si{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.det-h{padding:18px 22px;border-bottom:1px solid var(--b1);display:flex;gap:12px;align-items:flex-start;flex-shrink:0}
.det-x{width:30px;height:30px;border-radius:8px;background:var(--s2);border:1px solid var(--b1);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:15px;flex-shrink:0;transition:.13s}
.det-x:hover{border-color:var(--pink);color:var(--pink)}
.det-sj{font-family:'Syne',sans-serif;font-size:17px;font-weight:700;line-height:1.35;margin-bottom:4px}
.det-dt{font-size:11px;color:var(--muted)}
.det-m{padding:14px 22px;border-bottom:1px solid var(--b1);display:flex;gap:12px;align-items:flex-start;background:var(--s2);flex-shrink:0}
.det-av{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0}
.det-fn{font-size:14px;font-weight:600;margin-bottom:3px}
.det-fe{font-size:12px;color:var(--muted)}
.det-to{font-size:12px;color:var(--muted);margin-top:3px}
.det-ac{padding:10px 22px;border-bottom:1px solid var(--b1);display:flex;gap:8px;flex-shrink:0}
.det-ab{padding:6px 14px;border-radius:8px;background:var(--s2);border:1px solid var(--b1);color:var(--sub);font-size:12px;font-weight:600;cursor:pointer;transition:.13s;font-family:inherit}
.det-ab:hover{border-color:var(--p);color:var(--p2)}
.det-bd{flex:1;overflow-y:auto;padding:22px}
.det-bd-txt{font-size:13.5px;line-height:1.9;color:#cccce0;white-space:pre-wrap;word-break:break-word}

/* LOADER */
#ldr{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:999}
.ldr-ring{width:44px;height:44px;border:3px solid var(--b2);border-top-color:var(--p);border-radius:50%;animation:spin .75s linear infinite;box-shadow:0 0 20px rgba(123,110,246,.3)}
@keyframes spin{to{transform:rotate(360deg)}}
.ldr-txt{font-size:14px;color:var(--sub)}
.sk{background:linear-gradient(90deg,var(--s2) 25%,var(--s3) 50%,var(--s2) 75%);background-size:200%;animation:shim 1.2s infinite;border-radius:6px}
@keyframes shim{0%{background-position:200% 0}100%{background-position:-200% 0}}
.sk-l{height:12px;margin-bottom:9px}
#toast{position:fixed;bottom:22px;right:22px;padding:13px 20px;border-radius:14px;background:var(--s2);border:1px solid var(--b2);border-left:3px solid var(--teal);font-size:13px;color:var(--text);box-shadow:0 12px 30px rgba(0,0,0,.5);z-index:9999;display:none}
#toast.err{border-left-color:var(--pink)}
@media(max-width:768px){.app{grid-template-columns:1fr}.sb{display:none}.det{width:100vw}.stats{display:none}}
</style>
</head>
<body>
<div class="glow g1"></div>
<div class="glow g2"></div>

<div id="ldr"><div class="ldr-ring"></div><div class="ldr-txt" id="ldr-t">Connecting...</div></div>

<header class="hdr">
  <div class="logo">✉</div>
  <div class="logo-text">ZohoMail Viewer</div>
  <div class="hdr-r">
    <div class="pill"><span class="pulse"></span><span id="hdr-em">Loading...</span></div>
  </div>
</header>

<div class="app">
  <aside class="sb">
    <div class="sb-body">
      <div class="sb-sec">Folders</div>
      <div id="fl"></div>
    </div>
    <div class="sb-div"></div>
    <div class="sb-ft">
      <div class="sb-ft-l">Account</div>
      <div class="sb-ft-e" id="sb-em">—</div>
    </div>
  </aside>

  <main class="main">
    <div class="bar">
      <div class="srch">
        <span style="color:var(--muted);font-size:15px">⌕</span>
        <input type="text" id="srch" placeholder="Search sender, subject, content..." oninput="onSearch()">
      </div>
      <button class="btn" onclick="refresh()">↻ Refresh</button>
    </div>
    <div class="stats">
      <div class="stat"><div class="stat-d" style="background:var(--p);box-shadow:0 0 8px var(--p)"></div><div><div class="stat-v" id="sv-t">—</div><div class="stat-l">Total</div></div></div>
      <div class="stat"><div class="stat-d" style="background:var(--pink);box-shadow:0 0 8px var(--pink)"></div><div><div class="stat-v" id="sv-u">—</div><div class="stat-l">Unread</div></div></div>
      <div class="stat"><div class="stat-d" style="background:var(--teal);box-shadow:0 0 8px var(--teal)"></div><div><div class="stat-v" id="sv-f" style="font-size:14px;padding-top:4px">—</div><div class="stat-l">Folder</div></div></div>
    </div>
    <div class="list" id="list"></div>
    <div class="pager" id="pager"></div>
  </main>
</div>

<div class="det" id="det">
  <div class="det-h">
    <button class="det-x" onclick="closeDet()">✕</button>
    <div style="flex:1;min-width:0">
      <div class="det-sj" id="d-sj">—</div>
      <div class="det-dt" id="d-dt"></div>
    </div>
  </div>
  <div class="det-m">
    <div class="det-av" id="d-av">?</div>
    <div><div class="det-fn" id="d-fn"></div><div class="det-fe" id="d-fe"></div><div class="det-to" id="d-to"></div></div>
  </div>
  <div class="det-ac">
    <button class="det-ab">↩ Reply</button>
    <button class="det-ab">→ Forward</button>
    <button class="det-ab">⬇ Download</button>
  </div>
  <div class="det-bd"><div id="d-bd" class="det-bd-txt"></div></div>
</div>

<div id="toast"></div>

<script>
const API='/api/emails', PER=30;
let emails=[],folders=[],curFolder='',curPage=1,searchQ='',total=0;
const C=['#7B6EF6','#F06292','#4ECDC4','#FFB347','#42A5F5','#AB47BC','#EF5350','#26A69A'];
const FI={inbox:'📥',sent:'📤',drafts:'📝',spam:'🚫',trash:'🗑️',archive:'📦',notification:'🔔',newsletter:'📰',templates:'📋',snoozed:'😴',outbox:'📬',starred:'⭐'};
const FO=['Inbox','Sent','Drafts','Spam','Trash','Templates','Snoozed','Outbox','Notification','Newsletter','Archive'];
const $=id=>document.getElementById(id);
function col(s){let h=0;for(const c of(s||''))h=(h*31+c.charCodeAt(0))%C.length;return C[h]}
function ini(s){return(s||'?').split(/[\s@]+/).map(w=>w[0]).join('').toUpperCase().slice(0,2)||'?'}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function dh(s){const t=document.createElement('textarea');t.innerHTML=s||'';return t.value}
function nm(a){if(!a)return'';if(a.includes('<'))return a.split('<')[0].trim().replace(/"/g,'');return a.split('@')[0]}
function fS(ms){if(!ms)return'';const d=new Date(+ms),n=new Date();if(d.toDateString()===n.toDateString())return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});if(n-d<7*864e5)return d.toLocaleDateString([],{weekday:'short'});return d.toLocaleDateString([],{month:'short',day:'numeric'})}
function fL(ms){if(!ms)return'';return new Date(+ms).toLocaleString([],{dateStyle:'long',timeStyle:'short'})}
function load(msg){$('ldr').style.display='flex';$('ldr-t').textContent=msg||'Loading...'}
function hide(){$('ldr').style.display='none'}
function toast(m,e=false){const t=$('toast');t.textContent=m;t.className=e?'err':'';t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',5000)}

async function loadEmails(folder=''){
  load(folder?`Loading ${folder}...`:'Auto-detecting folder...');
  closeDet();
  try{
    const r=await fetch(folder?`${API}?folder=${encodeURIComponent(folder)}&limit=200`:`${API}?limit=200`);
    if(!r.ok)throw new Error('HTTP '+r.status);
    const d=await r.json();
    if(d.error)throw new Error(d.error);
    emails=Array.isArray(d.emails)?d.emails:[];
    folders=Array.isArray(d.folders)?d.folders:[];
    curFolder=d.activeFolder||folder||'';
    total=d.total||emails.length;
    const em=d.accountEmail||'';
    $('hdr-em').textContent=em||'Connected';
    $('sb-em').textContent=em;
    $('sv-t').textContent=total;
    $('sv-u').textContent=emails.filter(m=>m.status==='0').length;
    $('sv-f').textContent=curFolder;
    renderFolders();
    curPage=1;searchQ='';$('srch').value='';
    renderList();
    hide();
  }catch(e){
    hide();
    $('list').innerHTML=`<div class="empty"><div class="empty-ic">⚠️</div><div class="empty-t">Failed to load</div><div class="empty-s">${esc(e.message)}<br><br>Debug: <strong>/api/emails?debug=1</strong></div></div>`;
    toast(e.message,true);
  }
}

function renderFolders(){
  const map={};folders.forEach(f=>map[f.name]=f);
  const sorted=[];
  FO.forEach(n=>{if(map[n])sorted.push(map[n])});
  folders.forEach(f=>{if(!FO.includes(f.name))sorted.push(f)});
  $('fl').innerHTML=sorted.map(f=>{
    const ic=FI[f.name.toLowerCase()]||'📁',on=f.name===curFolder?'on':'',u=f.unread||0;
    return`<div class="fi ${on}" onclick="sw('${esc(f.name)}',this)">
      <span class="fi-ic">${ic}</span><span class="fi-nm">${esc(f.name)}</span>
      <span class="fi-ct ${u===0?'z':''}">${u}</span></div>`;
  }).join('');
}

function sw(name,el){document.querySelectorAll('.fi').forEach(f=>f.classList.remove('on'));el.classList.add('on');loadEmails(name)}

function filtered(){
  if(!searchQ)return emails;
  const q=searchQ.toLowerCase();
  return emails.filter(m=>dh(m.subject||'').toLowerCase().includes(q)||(m.fromAddress||m.sender||'').toLowerCase().includes(q)||(m.summary||'').toLowerCase().includes(q));
}

function renderList(){
  const list=filtered(),tot=list.length,s=(curPage-1)*PER,page=list.slice(s,s+PER),el=$('list');
  if(!page.length){
    el.innerHTML=`<div class="empty"><div class="empty-ic">📭</div><div class="empty-t">${searchQ?'No results':'No messages'}</div><div class="empty-s">${searchQ?'Try a different term':'This folder is empty'}</div></div>`;
    $('pager').innerHTML='';return;
  }
  el.innerHTML=page.map((m,i)=>{
    const from=m.fromAddress||m.sender||'',n=nm(from),c=col(from),u=m.status==='0',sj=dh(m.subject||'(No Subject)');
    return`<div class="ei${u?' unread':''}" onclick="openMsg(${s+i},this)">
      <div class="e-av" style="background:${c}20;color:${c}">${ini(n||from)}</div>
      <div class="e-bd">
        <div class="e-fr">${esc(n||from||'Unknown')}</div>
        <div class="e-sj">${esc(sj)}</div>
        <div class="e-pv">${esc(m.summary||'')}</div>
      </div>
      <div class="e-rt">
        <div class="e-tm">${fS(m.receivedTime||m.sentDateInGMT)}</div>
        ${u?'<span class="e-dot"></span>':''}
      </div></div>`;
  }).join('');
  renderPager(tot);
}

function renderPager(tot){
  const el=$('pager'),pages=Math.ceil(tot/PER);
  if(pages<=1){el.innerHTML='';return}
  let h=`<button class="pb" onclick="gp(${curPage-1})" ${curPage===1?'disabled':''}>‹</button>`;
  const W=7,s=Math.max(1,Math.min(curPage-3,pages-W+1)),e=Math.min(pages,s+W-1);
  if(s>1)h+=`<button class="pb" onclick="gp(1)">1</button><span class="pinfo">…</span>`;
  for(let i=s;i<=e;i++)h+=`<button class="pb${i===curPage?' on':''}" onclick="gp(${i})">${i}</button>`;
  if(e<pages)h+=`<span class="pinfo">…</span><button class="pb" onclick="gp(${pages})">${pages}</button>`;
  h+=`<button class="pb" onclick="gp(${curPage+1})" ${curPage===pages?'disabled':''}>›</button>`;
  h+=`<span class="pinfo">${tot} msgs</span>`;
  el.innerHTML=h;
}

function gp(n){const p=Math.ceil(filtered().length/PER);if(n<1||n>p)return;curPage=n;renderList();$('list').scrollTop=0}
function onSearch(){searchQ=$('srch').value;curPage=1;renderList()}
function refresh(){loadEmails(curFolder)}

async function openMsg(idx,el){
  const list=filtered(),m=list[idx];
  if(!m)return;
  document.querySelectorAll('.ei').forEach(e=>e.classList.remove('sel'));
  el.classList.add('sel');el.classList.remove('unread');
  $('det').style.display='flex';
  const from=m.fromAddress||m.sender||'',n=nm(from),c=col(from);
  $('d-sj').textContent=dh(m.subject||'(No Subject)');
  $('d-dt').textContent=fL(m.receivedTime||m.sentDateInGMT);
  const av=$('d-av');
  av.textContent=ini(n||from);
  av.style.cssText=`background:${c}20;color:${c};width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0`;
  $('d-fn').textContent=n||from;
  $('d-fe').textContent=from;
  $('d-to').textContent='To: '+dh(m.toAddress||'');
  const bd=$('d-bd');
  bd.innerHTML='<div class="sk sk-l" style="width:90%"></div><div class="sk sk-l" style="width:75%"></div><div class="sk sk-l" style="width:83%"></div><div class="sk sk-l" style="width:60%;margin-top:18px"></div><div class="sk sk-l" style="width:78%"></div>';
  const mid=m.messageId||m.mid||'';
  if(!mid){bd.textContent=m.summary||'(No message ID)';return}
  try{
    const r=await fetch(`${API}?msgId=${encodeURIComponent(mid)}`);
    const d=await r.json();
    const msg=d.message||d;
    if(msg.htmlBody){
      const fr=document.createElement('iframe');
      fr.style.cssText='width:100%;border:none;min-height:400px;background:#fff;border-radius:10px';
      fr.srcdoc=msg.htmlBody;bd.innerHTML='';bd.appendChild(fr);
      fr.onload=()=>{try{fr.style.height=fr.contentDocument.body.scrollHeight+40+'px'}catch(e){}};
    }else{bd.textContent=msg.content||msg.body||m.summary||'(No content)'}
  }catch(e){bd.textContent=m.summary||'Error: '+e.message}
}

function closeDet(){$('det').style.display='none';document.querySelectorAll('.ei').forEach(e=>e.classList.remove('sel'))}

loadEmails('');
</script>
