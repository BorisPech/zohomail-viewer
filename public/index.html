<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZohoMail Viewer</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#05050f;--s1:#0c0c1e;--s2:#111128;--s3:#181835;--b1:rgba(255,255,255,0.06);--b2:rgba(255,255,255,0.11);--p:#7B6EF6;--p2:#9B8EFF;--pd:rgba(123,110,246,.13);--pink:#F06292;--teal:#4ECDC4;--text:#EEEEF8;--sub:#9090B0;--mut:#4A4A6A}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text)}
.bg1,.bg2{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0}
.bg1{width:600px;height:600px;top:-250px;left:-200px;background:rgba(123,110,246,.08)}
.bg2{width:500px;height:500px;bottom:-250px;right:-150px;background:rgba(240,98,146,.06)}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--b2);border-radius:3px}

/* HEADER */
.hdr{z-index:20;position:relative;height:56px;display:flex;align-items:center;padding:0 20px;gap:12px;background:rgba(5,5,15,.9);backdrop-filter:blur(24px);border-bottom:1px solid var(--b1);flex-shrink:0}
.logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#7B6EF6,#F06292);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;box-shadow:0 0 18px rgba(123,110,246,.5)}
.app-name{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;background:linear-gradient(90deg,#fff,var(--p2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.chip{display:flex;align-items:center;gap:6px;padding:5px 12px;background:var(--s2);border:1px solid var(--b2);border-radius:20px;font-size:12px;color:var(--sub)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--teal);box-shadow:0 0 8px var(--teal);animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* LAYOUT */
.layout{display:grid;grid-template-columns:230px 1fr;height:calc(100vh - 56px);overflow:hidden;position:relative;z-index:1}

/* SIDEBAR */
.sb{background:var(--s1);border-right:1px solid var(--b1);display:flex;flex-direction:column}
.sb-body{flex:1;overflow-y:auto;padding:10px 8px}
.sb-lbl{font-size:10px;font-weight:700;letter-spacing:2px;color:var(--mut);text-transform:uppercase;padding:4px 8px 8px}
.fi{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:9px;cursor:pointer;transition:.15s;border:1px solid transparent;margin-bottom:1px}
.fi:hover{background:var(--s2);border-color:var(--b1)}
.fi.on{background:var(--pd);border-color:rgba(123,110,246,.3)}
.fi.on .fn{color:var(--p2)}
.fic{font-size:14px;width:20px;text-align:center;flex-shrink:0}
.fn{flex:1;font-size:13px;font-weight:500}
.fc{font-size:11px;font-weight:700;padding:2px 7px;border-radius:12px;background:var(--p);color:#fff;min-width:20px;text-align:center}
.fc.z{background:var(--s3);color:var(--mut)}
.sb-div{height:1px;background:var(--b1);margin:6px 10px}
.sb-ft{padding:12px 14px;border-top:1px solid var(--b1);flex-shrink:0}
.sb-ft-l{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:1px;margin-bottom:3px}
.sb-ft-e{font-size:11px;color:var(--sub);word-break:break-all;line-height:1.4}

/* MAIN */
.main{display:flex;flex-direction:column;overflow:hidden}
.bar{padding:11px 18px;display:flex;gap:9px;align-items:center;background:var(--s1);border-bottom:1px solid var(--b1);flex-shrink:0}
.srch{flex:1;display:flex;align-items:center;gap:9px;background:var(--s2);border:1px solid var(--b1);border-radius:9px;padding:8px 13px;transition:.15s}
.srch:focus-within{border-color:var(--p)}
.srch input{flex:1;background:transparent;border:none;color:var(--text);font-size:13px;font-family:inherit;outline:none}
.srch input::placeholder{color:var(--mut)}
.btn{padding:8px 15px;border-radius:9px;background:var(--s2);border:1px solid var(--b1);color:var(--sub);font-size:12px;font-weight:600;cursor:pointer;transition:.15s;font-family:inherit;white-space:nowrap}
.btn:hover{border-color:var(--p);color:var(--p2)}

/* STATS */
.stats{display:flex;border-bottom:1px solid var(--b1);flex-shrink:0}
.st{flex:1;padding:10px 18px;display:flex;align-items:center;gap:9px;background:var(--s1)}
.st+.st{border-left:1px solid var(--b1)}
.st-d{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.st-v{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;line-height:1}
.st-l{font-size:11px;color:var(--mut);margin-top:1px}

/* LIST */
.list{flex:1;overflow-y:auto}
.ei{display:grid;grid-template-columns:46px 1fr auto;gap:11px;align-items:start;padding:13px 18px;border-bottom:1px solid var(--b1);cursor:pointer;transition:background .12s;position:relative}
.ei:hover{background:var(--s1)}
.ei.unread{background:rgba(123,110,246,.06)}
.ei.unread::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--p);border-radius:0 2px 2px 0}
.ei.sel{background:var(--s2)}
.eav{width:40px;height:40px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.ebd{min-width:0}
.efr{font-size:13px;font-weight:600;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ei:not(.unread) .efr{font-weight:400;color:var(--sub)}
.esj{font-size:12px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ei.unread .esj{color:var(--text);font-weight:600}
.ei:not(.unread) .esj{color:var(--mut)}
.epv{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ert{text-align:right;flex-shrink:0;padding-top:1px}
.etm{font-size:11px;color:var(--mut);margin-bottom:5px}
.eud{width:7px;height:7px;border-radius:50%;background:var(--p);display:inline-block;box-shadow:0 0 5px var(--p)}

/* EMPTY */
.empty{padding:80px 20px;text-align:center}
.empty-i{font-size:48px;margin-bottom:16px;opacity:.3}
.empty-t{font-family:'Syne',sans-serif;font-size:20px;margin-bottom:8px}
.empty-s{font-size:13px;color:var(--mut);line-height:1.7}

/* PAGER */
.pager{padding:11px 18px;display:flex;align-items:center;justify-content:center;gap:5px;border-top:1px solid var(--b1);background:var(--s1);flex-shrink:0}
.pb{width:31px;height:31px;border-radius:8px;background:var(--s2);border:1px solid var(--b1);color:var(--text);cursor:pointer;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;transition:.12s}
.pb:hover,.pb.on{background:var(--p);border-color:var(--p);color:#fff}
.pb:disabled{opacity:.3;cursor:default;pointer-events:none}
.pi{font-size:12px;color:var(--mut);padding:0 6px}

/* DETAIL */
.det{position:fixed;top:56px;right:0;width:52vw;max-width:800px;height:calc(100vh - 56px);background:var(--s1);border-left:1px solid var(--b2);display:none;flex-direction:column;z-index:30;animation:si .2s ease}
@keyframes si{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.dh{padding:16px 20px;border-bottom:1px solid var(--b1);display:flex;gap:11px;align-items:flex-start;flex-shrink:0}
.dx{width:28px;height:28px;border-radius:8px;background:var(--s2);border:1px solid var(--b1);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:14px;flex-shrink:0;transition:.12s}
.dx:hover{border-color:var(--pink);color:var(--pink)}
.dsj{font-family:'Syne',sans-serif;font-size:16px;font-weight:700;line-height:1.3;margin-bottom:3px}
.ddt{font-size:11px;color:var(--mut)}
.dm{padding:12px 20px;border-bottom:1px solid var(--b1);display:flex;gap:11px;background:var(--s2);flex-shrink:0}
.dav{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
.dfn{font-size:13px;font-weight:600;margin-bottom:2px}
.dfe{font-size:11px;color:var(--mut)}
.dto{font-size:11px;color:var(--mut);margin-top:2px}
.da{padding:9px 20px;border-bottom:1px solid var(--b1);display:flex;gap:7px;flex-shrink:0}
.dab{padding:5px 13px;border-radius:8px;background:var(--s2);border:1px solid var(--b1);color:var(--sub);font-size:12px;font-weight:600;cursor:pointer;transition:.12s;font-family:inherit}
.dab:hover{border-color:var(--p);color:var(--p2)}
.db{flex:1;overflow-y:auto;padding:20px}
.db-txt{font-size:13px;line-height:1.9;color:#cccce0;white-space:pre-wrap;word-break:break-word}

/* LOADER */
#ldr{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:999}
.ring{width:42px;height:42px;border:3px solid var(--b2);border-top-color:var(--p);border-radius:50%;animation:spin .7s linear infinite;box-shadow:0 0 16px rgba(123,110,246,.3)}
@keyframes spin{to{transform:rotate(360deg)}}
.ring-t{font-size:13px;color:var(--sub)}
.sk{background:linear-gradient(90deg,var(--s2) 25%,var(--s3) 50%,var(--s2) 75%);background-size:200%;animation:shim 1.1s infinite;border-radius:5px}
@keyframes shim{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skl{height:11px;margin-bottom:8px}
#toast{position:fixed;bottom:20px;right:20px;padding:12px 18px;border-radius:12px;background:var(--s2);border:1px solid var(--b2);border-left:3px solid var(--teal);font-size:12px;color:var(--text);box-shadow:0 10px 28px rgba(0,0,0,.5);z-index:9999;display:none}
#toast.err{border-left-color:var(--pink)}
@media(max-width:768px){.layout{grid-template-columns:1fr}.sb{display:none}.det{width:100vw}.stats{display:none}}
</style>
</head>
<body>
<div class="bg1"></div><div class="bg2"></div>

<div id="ldr"><div class="ring"></div><div class="ring-t" id="ldr-t">Connecting...</div></div>

<header class="hdr">
  <div class="logo">✉</div>
  <div class="app-name">ZohoMail Viewer</div>
  <div class="hdr-r">
    <div class="chip"><span class="dot"></span><span id="hdr-em">Loading...</span></div>
  </div>
</header>

<div class="layout">
  <aside class="sb">
    <div class="sb-body">
      <div class="sb-lbl">Folders</div>
      <div id="fl"></div>
    </div>
    <div class="sb-div"></div>
    <div class="sb-ft">
      <div class="sb-ft-l">Account</div>
      <div class="sb-ft-e" id="sb-em">—</div>
    </div>
  </aside>

  <main class="main">
    <div class="bar">
      <div class="srch">
        <span style="color:var(--mut);font-size:15px">⌕</span>
        <input type="text" id="srch" placeholder="Search sender, subject, content..." oninput="onSearch()">
      </div>
      <button class="btn" onclick="refresh()">↻ Refresh</button>
    </div>
    <div class="stats">
      <div class="st"><div class="st-d" style="background:var(--p)"></div><div><div class="st-v" id="sv-t">—</div><div class="st-l">Total</div></div></div>
      <div class="st"><div class="st-d" style="background:var(--pink)"></div><div><div class="st-v" id="sv-u">—</div><div class="st-l">Unread</div></div></div>
      <div class="st"><div class="st-d" style="background:var(--teal)"></div><div><div class="st-v" id="sv-f" style="font-size:13px;padding-top:4px">—</div><div class="st-l">Folder</div></div></div>
    </div>
    <div class="list" id="list"></div>
    <div class="pager" id="pager"></div>
  </main>
</div>

<div class="det" id="det">
  <div class="dh">
    <button class="dx" onclick="closeDet()">✕</button>
    <div style="flex:1;min-width:0"><div class="dsj" id="d-sj">—</div><div class="ddt" id="d-dt"></div></div>
  </div>
  <div class="dm">
    <div class="dav" id="d-av">?</div>
    <div><div class="dfn" id="d-fn"></div><div class="dfe" id="d-fe"></div><div class="dto" id="d-to"></div></div>
  </div>
  <div class="da">
    <button class="dab">↩ Reply</button>
    <button class="dab">→ Forward</button>
    <button class="dab">⬇ Download</button>
  </div>
  <div class="db"><div id="d-bd" class="db-txt"></div></div>
</div>

<div id="toast"></div>

<script>
const API='/api/emails', PER=30;
let ems=[],fols=[],cur='',page=1,q='';
const C=['#7B6EF6','#F06292','#4ECDC4','#FFB347','#42A5F5','#AB47BC','#EF5350','#26A69A'];
const FI={inbox:'📥',sent:'📤',drafts:'📝',spam:'🚫',trash:'🗑️',archive:'📦',notification:'🔔',newsletter:'📰',templates:'📋',snoozed:'😴',outbox:'📬',starred:'⭐'};
const FO=['Inbox','Sent','Drafts','Spam','Trash','Templates','Snoozed','Outbox','Notification','Newsletter','Archive'];
const $=id=>document.getElementById(id);
function col(s){let h=0;for(const c of(s||''))h=(h*31+c.charCodeAt(0))%C.length;return C[h]}
function ini(s){return(s||'?').split(/[\s@]+/).map(w=>w[0]).join('').toUpperCase().slice(0,2)||'?'}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function dh(s){const t=document.createElement('textarea');t.innerHTML=s||'';return t.value}
function nm(a){if(!a)return'';if(a.includes('<'))return a.split('<')[0].trim().replace(/"/g,'');return a.split('@')[0]}
function fS(ms){if(!ms)return'';const d=new Date(+ms),n=new Date();if(d.toDateString()===n.toDateString())return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});if(n-d<7*864e5)return d.toLocaleDateString([],{weekday:'short'});return d.toLocaleDateString([],{month:'short',day:'numeric'})}
function fL(ms){if(!ms)return'';return new Date(+ms).toLocaleString([],{dateStyle:'long',timeStyle:'short'})}
function showLoad(m){$('ldr').style.display='flex';$('ldr-t').textContent=m||'Loading...'}
function hideLoad(){$('ldr').style.display='none'}
function toast(m,e=false){const t=$('toast');t.textContent=m;t.className=e?'err':'';t.style.display='block';clearTimeout(t._);t._=setTimeout(()=>t.style.display='none',5000)}

async function loadEmails(folder=''){
  showLoad(folder?`Loading ${folder}...`:'Loading...');
  closeDet();
  try{
    const r=await fetch(folder?`${API}?folder=${encodeURIComponent(folder)}&limit=200`:`${API}?limit=200`);
    if(!r.ok)throw new Error('HTTP '+r.status);
    const d=await r.json();
    if(d.error)throw new Error(d.error);
    ems=Array.isArray(d.emails)?d.emails:[];
    fols=Array.isArray(d.folders)?d.folders:[];
    cur=d.activeFolder||folder||'';
    const em=d.accountEmail||'';
    $('hdr-em').textContent=em||'Connected';
    $('sb-em').textContent=em;
    $('sv-t').textContent=ems.length;
    $('sv-u').textContent=ems.filter(m=>m.status==='0').length;
    $('sv-f').textContent=cur;
    renderFolders();
    page=1;q='';$('srch').value='';
    renderList();
    hideLoad();
  }catch(e){
    hideLoad();
    $('list').innerHTML=`<div class="empty"><div class="empty-i">⚠️</div><div class="empty-t">Error</div><div class="empty-s">${esc(e.message)}<br><br>Visit <strong>/api/emails?debug=1</strong></div></div>`;
    toast(e.message,true);
  }
}

function renderFolders(){
  const map={};fols.forEach(f=>map[f.name]=f);
  const s=[];FO.forEach(n=>{if(map[n])s.push(map[n])});
  fols.forEach(f=>{if(!FO.includes(f.name))s.push(f)});
  $('fl').innerHTML=s.map(f=>{
    const ic=FI[f.name.toLowerCase()]||'📁',on=f.name===cur?'on':'',u=f.unread||0;
    return`<div class="fi ${on}" onclick="sw('${esc(f.name)}',this)">
      <span class="fic">${ic}</span><span class="fn">${esc(f.name)}</span>
      <span class="fc ${u===0?'z':''}">${u}</span></div>`;
  }).join('');
}

function sw(name,el){document.querySelectorAll('.fi').forEach(f=>f.classList.remove('on'));el.classList.add('on');loadEmails(name)}

function filt(){
  if(!q)return ems;
  const lq=q.toLowerCase();
  return ems.filter(m=>dh(m.subject||'').toLowerCase().includes(lq)||(m.fromAddress||m.sender||'').toLowerCase().includes(lq)||(m.summary||'').toLowerCase().includes(lq));
}

function renderList(){
  const list=filt(),tot=list.length,s=(page-1)*PER,pg=list.slice(s,s+PER),el=$('list');
  if(!pg.length){
    el.innerHTML=`<div class="empty"><div class="empty-i">📭</div><div class="empty-t">${q?'No results':'No messages'}</div><div class="empty-s">${q?'Try different keywords':'This folder is empty'}</div></div>`;
    $('pager').innerHTML='';return;
  }
  el.innerHTML=pg.map((m,i)=>{
    const from=m.fromAddress||m.sender||'',n=nm(from),c=col(from),u=m.status==='0',sj=dh(m.subject||'(No Subject)');
    return`<div class="ei${u?' unread':''}" onclick="openMsg(${s+i},this)">
      <div class="eav" style="background:${c}20;color:${c}">${ini(n||from)}</div>
      <div class="ebd">
        <div class="efr">${esc(n||from||'Unknown')}</div>
        <div class="esj">${esc(sj)}</div>
        <div class="epv">${esc(m.summary||'')}</div>
      </div>
      <div class="ert"><div class="etm">${fS(m.receivedTime||m.sentDateInGMT)}</div>${u?'<span class="eud"></span>':''}</div>
    </div>`;
  }).join('');
  renderPager(tot);
}

function renderPager(tot){
  const el=$('pager'),pages=Math.ceil(tot/PER);
  if(pages<=1){el.innerHTML='';return}
  let h=`<button class="pb" onclick="gp(${page-1})" ${page===1?'disabled':''}>‹</button>`;
  const W=7,s=Math.max(1,Math.min(page-3,pages-W+1)),e=Math.min(pages,s+W-1),s2=Math.max(1,e-W+1);
  if(s2>1)h+=`<button class="pb" onclick="gp(1)">1</button><span class="pi">…</span>`;
  for(let i=s2;i<=e;i++)h+=`<button class="pb${i===page?' on':''}" onclick="gp(${i})">${i}</button>`;
  if(e<pages)h+=`<span class="pi">…</span><button class="pb" onclick="gp(${pages})">${pages}</button>`;
  h+=`<button class="pb" onclick="gp(${page+1})" ${page===pages?'disabled':''}>›</button>`;
  h+=`<span class="pi">${tot} msgs</span>`;
  el.innerHTML=h;
}

function gp(n){const p=Math.ceil(filt().length/PER);if(n<1||n>p)return;page=n;renderList();$('list').scrollTop=0}
function onSearch(){q=$('srch').value;page=1;renderList()}
function refresh(){loadEmails(cur)}

async function openMsg(idx,el){
  const list=filt(),m=list[idx];if(!m)return;
  document.querySelectorAll('.ei').forEach(e=>e.classList.remove('sel'));
  el.classList.add('sel');el.classList.remove('unread');
  $('det').style.display='flex';
  const from=m.fromAddress||m.sender||'',n=nm(from),c=col(from);
  $('d-sj').textContent=dh(m.subject||'(No Subject)');
  $('d-dt').textContent=fL(m.receivedTime||m.sentDateInGMT);
  const av=$('d-av');av.textContent=ini(n||from);
  av.style.cssText=`background:${c}20;color:${c};width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0`;
  $('d-fn').textContent=n||from;$('d-fe').textContent=from;$('d-to').textContent='To: '+dh(m.toAddress||'');
  const bd=$('d-bd');
  bd.innerHTML='<div class="sk skl" style="width:90%"></div><div class="sk skl" style="width:75%"></div><div class="sk skl" style="width:82%"></div><div class="sk skl" style="width:60%;margin-top:16px"></div><div class="sk skl" style="width:77%"></div>';
  const mid=m.messageId||m.mid||'';
  if(!mid){bd.textContent=m.summary||'(No content)';return}
  try{
    const r=await fetch(`${API}?msgId=${encodeURIComponent(mid)}`);
    const d=await r.json();const msg=d.message||d;
    if(msg.htmlBody){
      const fr=document.createElement('iframe');
      fr.style.cssText='width:100%;border:none;min-height:400px;background:#fff;border-radius:10px';
      fr.srcdoc=msg.htmlBody;bd.innerHTML='';bd.appendChild(fr);
      fr.onload=()=>{try{fr.style.height=fr.contentDocument.body.scrollHeight+40+'px'}catch(e){}};
    }else{bd.textContent=msg.content||msg.body||m.summary||'(No content)'}
  }catch(e){bd.textContent=m.summary||'Error: '+e.message}
}
