<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zoho Mail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,::before,::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0a;--s1:#111;--s2:#1a1a1a;--s3:#222;--s4:#2a2a2a;
  --b1:#1f1f1f;--b2:#2a2a2a;--b3:#333;
  --tx:#ededed;--tx2:#a1a1aa;--tx3:#52525b;
  --ac:#6366f1;--ac2:#818cf8;
  --gr:#22c55e;--rd:#ef4444;--am:#f59e0b;
  --r:6px;--r2:10px;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);
  font-family:'Geist',system-ui,sans-serif;font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--b2);border-radius:2px}

/* TOPBAR */
.topbar{
  height:48px;display:flex;align-items:center;padding:0 16px;gap:10px;
  background:var(--s1);border-bottom:1px solid var(--b1);
  position:relative;z-index:100;flex-shrink:0;
}
.brand{display:flex;align-items:center;gap:8px}
.brand-ic{
  width:26px;height:26px;border-radius:6px;background:var(--ac);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:13px;font-weight:700;
  box-shadow:0 0 0 1px rgba(99,102,241,.4),0 2px 8px rgba(99,102,241,.2);
}
.brand-name{font-size:14px;font-weight:600;letter-spacing:-.3px}
.topbar-gap{flex:1}
.live-badge{
  display:flex;align-items:center;gap:5px;padding:4px 10px;
  border-radius:20px;border:1px solid rgba(34,197,94,.2);
  background:rgba(34,197,94,.06);font-size:11px;color:var(--gr);
}
.live-dot{width:5px;height:5px;border-radius:50%;background:var(--gr);
  box-shadow:0 0 0 2px rgba(34,197,94,.2);animation:pulse 2.5s ease infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* APP */
.app{display:grid;grid-template-columns:220px 1fr;height:calc(100vh - 48px);overflow:hidden}

/* SIDEBAR */
.sb{background:var(--s1);border-right:1px solid var(--b1);display:flex;flex-direction:column;overflow:hidden}
.sb-top{padding:12px 10px 8px;flex-shrink:0}
.sb-search{
  display:flex;align-items:center;gap:7px;padding:7px 10px;
  background:var(--s2);border:1px solid var(--b1);border-radius:var(--r2);transition:.15s;
}
.sb-search:focus-within{border-color:var(--ac)}
.sb-search input{flex:1;background:transparent;border:none;outline:none;font-size:12px;color:var(--tx);font-family:inherit}
.sb-search input::placeholder{color:var(--tx3)}
.sb-list{flex:1;overflow-y:auto;padding:8px 8px 0}
.sb-sec{font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--tx3);padding:6px 6px 4px}
.fi{
  display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:var(--r);
  cursor:pointer;font-size:13px;color:var(--tx2);border:1px solid transparent;
  margin-bottom:1px;background:transparent;width:100%;text-align:left;
  font-family:inherit;transition:.12s;
}
.fi:hover{background:var(--s2);color:var(--tx)}
.fi.on{background:rgba(99,102,241,.1);border-color:rgba(99,102,241,.2);color:var(--ac2)}
.fi-ic{width:16px;text-align:center;font-size:13px;flex-shrink:0;opacity:.7}
.fi-nm{flex:1;font-weight:500}
.fi-ct{font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;background:var(--ac);color:#fff;min-width:18px;text-align:center}
.fi-ct.z{background:var(--s3);color:var(--tx3)}
.sb-div{height:1px;background:var(--b1);margin:8px 8px}

/* MAIN */
.main{display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}

/* toolbar */
.toolbar{
  display:flex;align-items:center;gap:8px;padding:10px 16px;
  background:var(--s1);border-bottom:1px solid var(--b1);flex-shrink:0;
}
.srch-bar{
  flex:1;display:flex;align-items:center;gap:8px;
  background:var(--s2);border:1px solid var(--b1);border-radius:var(--r2);
  padding:8px 12px;transition:.15s;
}
.srch-bar:focus-within{border-color:var(--ac)}
.srch-bar input{flex:1;background:transparent;border:none;outline:none;font-size:13px;color:var(--tx);font-family:inherit}
.srch-bar input::placeholder{color:var(--tx3)}
.btn{
  display:flex;align-items:center;gap:5px;padding:7px 12px;border-radius:var(--r2);
  background:var(--s2);border:1px solid var(--b1);color:var(--tx2);
  font-size:12px;font-weight:500;cursor:pointer;transition:.12s;
  white-space:nowrap;font-family:inherit;
}
.btn:hover{border-color:var(--b2);color:var(--tx)}

/* stats */
.stats{display:flex;border-bottom:1px solid var(--b1);flex-shrink:0;background:var(--s1)}
.stat{flex:1;padding:10px 16px;display:flex;align-items:center;gap:10px}
.stat+.stat{border-left:1px solid var(--b1)}
.stat-ico{width:32px;height:32px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.stat-v{font-size:20px;font-weight:700;line-height:1;letter-spacing:-.5px}
.stat-l{font-size:11px;color:var(--tx3);margin-top:1px}

/* COUNT BAR */
.count-bar{
  padding:7px 16px;border-bottom:1px solid var(--b1);background:var(--s1);flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
}
.count-txt{font-size:12px;color:var(--tx3)}
.count-bold{color:var(--tx2);font-weight:600}

/* LIST — scroll all emails */
.list{flex:1;overflow-y:auto}

.email-row{
  display:grid;grid-template-columns:46px 1fr 65px;
  gap:10px;align-items:start;padding:12px 16px;
  border-bottom:1px solid var(--b1);cursor:pointer;
  position:relative;transition:background .1s;
}
.email-row:hover{background:var(--s1)}
.email-row.unread{background:rgba(99,102,241,.04)}
.email-row.unread::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--ac)}
.email-row.sel{background:var(--s2)}
.email-row:last-child{border-bottom:none}

.e-av{width:40px;height:40px;border-radius:var(--r2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0}
.e-bd{min-width:0}
.e-fr{font-size:13px;font-weight:600;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.email-row:not(.unread) .e-fr{font-weight:400;color:var(--tx2)}
.e-sj{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.email-row.unread .e-sj{color:var(--tx);font-weight:500}
.email-row:not(.unread) .e-sj{color:var(--tx3)}
.e-pv{font-size:11.5px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.e-rt{display:flex;flex-direction:column;align-items:flex-end;gap:5px;padding-top:2px}
.e-tm{font-size:11px;color:var(--tx3)}
.e-ud{width:7px;height:7px;border-radius:50%;background:var(--ac)}

/* empty */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:300px;padding:40px;text-align:center}
.empty-ic{width:52px;height:52px;border-radius:14px;background:var(--s2);border:1px solid var(--b1);display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 14px}
.empty-t{font-size:15px;font-weight:600;margin-bottom:6px}
.empty-s{font-size:13px;color:var(--tx3);line-height:1.7}

/* DETAIL */
.det{
  position:fixed;top:48px;right:0;
  width:48vw;max-width:720px;height:calc(100vh - 48px);
  background:var(--s1);border-left:1px solid var(--b2);
  display:none;flex-direction:column;z-index:50;
  animation:si .2s cubic-bezier(.16,1,.3,1);
}
@keyframes si{from{transform:translateX(18px);opacity:0}to{transform:none;opacity:1}}
.det-top{display:flex;align-items:flex-start;gap:10px;padding:14px 16px;border-bottom:1px solid var(--b1);flex-shrink:0}
.det-close{
  width:28px;height:28px;border-radius:var(--r);border:1px solid var(--b1);
  background:var(--s2);color:var(--tx2);font-size:14px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:.12s;flex-shrink:0;font-family:inherit;
}
.det-close:hover{border-color:var(--rd);color:var(--rd)}
.det-sj{font-size:15px;font-weight:600;color:var(--tx);line-height:1.35;margin-bottom:2px}
.det-dt{font-size:11px;color:var(--tx3)}
.det-meta{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--b1);background:var(--s2);flex-shrink:0}
.det-av{width:36px;height:36px;border-radius:var(--r2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.det-nm{font-size:13px;font-weight:600;margin-bottom:2px}
.det-em{font-size:11px;color:var(--tx3)}
.det-to{font-size:11px;color:var(--tx3);margin-top:2px}
.det-acts{display:flex;gap:6px;padding:8px 16px;border-bottom:1px solid var(--b1);flex-shrink:0}
.det-act{padding:5px 12px;border-radius:var(--r);border:1px solid var(--b1);background:var(--s2);color:var(--tx2);font-size:12px;font-weight:500;cursor:pointer;transition:.12s;font-family:inherit}
.det-act:hover{border-color:var(--b2);color:var(--tx)}
.det-body{flex:1;overflow-y:auto;padding:20px}
.det-body-txt{font-size:13px;line-height:1.85;color:var(--tx2);white-space:pre-wrap;word-break:break-word}

/* LOADER */
#ldr{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.spin{width:34px;height:34px;border-radius:50%;border:2px solid var(--b2);border-top-color:var(--ac);animation:sp .65s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.spin-t{font-size:13px;color:var(--tx2)}
.sk{background:linear-gradient(90deg,var(--s2) 25%,var(--s3) 50%,var(--s2) 75%);background-size:200%;animation:shim 1.2s ease-in-out infinite;border-radius:4px}
@keyframes shim{0%{background-position:200%}100%{background-position:-200%}}
.skl{height:10px;margin-bottom:8px}

/* TOAST */
#toast{position:fixed;bottom:18px;right:18px;z-index:999;padding:11px 16px;border-radius:var(--r2);background:var(--s2);border:1px solid var(--b2);border-left:3px solid var(--gr);font-size:12px;color:var(--tx);box-shadow:0 8px 24px rgba(0,0,0,.4);display:none;font-family:inherit}
#toast.err{border-left-color:var(--rd)}

/* RESPONSIVE */
@media(max-width:900px){.app{grid-template-columns:180px 1fr}}
@media(max-width:680px){.app{grid-template-columns:1fr}.sb{display:none}.det{width:100vw;max-width:none}.stats{display:none}}
</style>
</head>
<body>

<div id="ldr"><div class="spin"></div><div class="spin-t" id="ldr-t">Loading...</div></div>

<header class="topbar">
  <div class="brand">
    <div class="brand-ic">M</div>
    <span class="brand-name">Zoho Mail</span>
  </div>
  <div class="topbar-gap"></div>
  <div class="live-badge"><span class="live-dot"></span>Live</div>
</header>

<div class="app">
  <aside class="sb">
    <div class="sb-top">
      <div class="sb-search">
        <span style="color:var(--tx3);font-size:13px">⌕</span>
        <input id="sb-q" type="text" placeholder="Search..." oninput="doSearch(this.value)">
      </div>
    </div>
    <div class="sb-list">
      <div class="sb-sec">Folders</div>
      <div id="fl"></div>
    </div>
    <div class="sb-div"></div>
    <div style="padding:10px 12px;flex-shrink:0">
      <div style="font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--tx3);margin-bottom:3px">Folder</div>
      <div style="font-size:12px;color:var(--tx2)" id="cur-folder-name">—</div>
    </div>
  </aside>

  <main class="main">
    <div class="toolbar">
      <div class="srch-bar">
        <span style="color:var(--tx3);font-size:14px">⌕</span>
        <input id="main-q" type="text" placeholder="Search sender, subject or content..." oninput="doSearch(this.value)">
      </div>
      <button class="btn" onclick="doRefresh()">↻ Refresh</button>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-ico" style="background:rgba(99,102,241,.1);color:var(--ac)">✉</div>
        <div><div class="stat-v" id="sv-t">—</div><div class="stat-l">Total</div></div>
      </div>
      <div class="stat">
        <div class="stat-ico" style="background:rgba(239,68,68,.1);color:var(--rd)">◉</div>
        <div><div class="stat-v" id="sv-u">—</div><div class="stat-l">Unread</div></div>
      </div>
      <div class="stat">
        <div class="stat-ico" style="background:rgba(34,197,94,.1);color:var(--gr)">◈</div>
        <div><div class="stat-v" id="sv-f" style="font-size:13px;padding-top:3px">—</div><div class="stat-l">Folder</div></div>
      </div>
    </div>

    <div class="count-bar">
      <span class="count-txt">Showing <span class="count-bold" id="show-count">0</span> messages</span>
      <span class="count-txt" id="filter-info"></span>
    </div>

    <div class="list" id="list"></div>
  </main>
</div>

<div class="det" id="det">
  <div class="det-top">
    <button class="det-close" onclick="closeDet()">✕</button>
    <div style="flex:1;min-width:0">
      <div class="det-sj" id="d-sj">—</div>
      <div class="det-dt" id="d-dt"></div>
    </div>
  </div>
  <div class="det-meta">
    <div class="det-av" id="d-av">?</div>
    <div>
      <div class="det-nm" id="d-nm"></div>
      <div class="det-em" id="d-em"></div>
      <div class="det-to" id="d-to"></div>
    </div>
  </div>
  <div class="det-acts">
    <button class="det-act">↩ Reply</button>
    <button class="det-act">→ Forward</button>
    <button class="det-act">⬇ Download</button>
  </div>
  <div class="det-body"><div id="d-bd" class="det-body-txt"></div></div>
</div>

<div id="toast"></div>

<script>
const API='/api/emails';
let emails=[],folders=[],curFolder='',query='';

const COLS=[
  {bg:'rgba(99,102,241,.15)',fg:'#818cf8'},{bg:'rgba(239,68,68,.15)',fg:'#f87171'},
  {bg:'rgba(34,197,94,.15)',fg:'#4ade80'},{bg:'rgba(249,115,22,.15)',fg:'#fb923c'},
  {bg:'rgba(234,179,8,.15)',fg:'#facc15'},{bg:'rgba(168,85,247,.15)',fg:'#c084fc'},
  {bg:'rgba(20,184,166,.15)',fg:'#2dd4bf'},{bg:'rgba(236,72,153,.15)',fg:'#f472b6'},
];
const FI={inbox:'✉',sent:'↗',drafts:'✏',spam:'⚑',trash:'⊗',archive:'◫',notification:'◉',newsletter:'◈',templates:'◻',snoozed:'⏰',outbox:'↺',starred:'★'};
const FO=['Inbox','Sent','Drafts','Spam','Trash','Templates','Snoozed','Outbox','Notification','Newsletter','Archive'];

const $=id=>document.getElementById(id);
function col(s){let h=0;for(const c of(s||''))h=(h*31+c.charCodeAt(0))%COLS.length;return COLS[h]}
function ini(s){return(s||'?').split(/[\s@]+/).map(w=>w[0]).join('').toUpperCase().slice(0,2)||'?'}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function dh(s){const t=document.createElement('textarea');t.innerHTML=s||'';return t.value}
function snm(a){if(!a)return'';if(a.includes('<'))return a.split('<')[0].trim().replace(/['"]/g,'');return a.split('@')[0]}
function tS(ms){if(!ms)return'';const d=new Date(+ms),n=new Date();if(d.toDateString()===n.toDateString())return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});if(n-d<7*864e5)return d.toLocaleDateString([],{weekday:'short'});return d.toLocaleDateString([],{month:'short',day:'numeric'})}
function tL(ms){if(!ms)return'';return new Date(+ms).toLocaleString([],{dateStyle:'full',timeStyle:'short'})}

function showLdr(m){$('ldr').style.display='flex';$('ldr-t').textContent=m||'Loading...'}
function hideLdr(){$('ldr').style.display='none'}
function toast(m,e=false){const t=$('toast');t.textContent=m;t.className=e?'err':'';t.style.display='block';clearTimeout(t._);t._=setTimeout(()=>t.style.display='none',5000)}

async function loadFolder(folder=''){
  showLdr(folder?`Opening ${folder}...`:'Loading mailbox...');
  closeDet();
  try{
    const r=await fetch(folder?`${API}?folder=${encodeURIComponent(folder)}&limit=200`:`${API}?limit=200`);
    const d=await r.json();
    if(d.error)throw new Error(d.error);
    emails=Array.isArray(d.emails)?d.emails:[];
    folders=Array.isArray(d.folders)?d.folders:[];
    curFolder=d.activeFolder||folder||'';
    $('sv-t').textContent=emails.length;
    $('sv-u').textContent=emails.filter(m=>m.status==='0').length;
    $('sv-f').textContent=curFolder||'—';
    $('cur-folder-name').textContent=curFolder||'—';
    renderFolders();
    query='';$('sb-q').value='';$('main-q').value='';
    renderAll();
    hideLdr();
  }catch(e){
    hideLdr();
    $('list').innerHTML=`<div class="empty"><div class="empty-ic">⚠</div><div class="empty-t">Failed to load</div><div class="empty-s">${esc(e.message)}<br>Visit <code>/api/emails?debug=1</code></div></div>`;
    toast(e.message,true);
  }
}

function renderFolders(){
  const map={};folders.forEach(f=>map[f.name]=f);
  const sorted=[];FO.forEach(n=>{if(map[n])sorted.push(map[n])});folders.forEach(f=>{if(!FO.includes(f.name))sorted.push(f)});
  $('fl').innerHTML=sorted.map(f=>{
    const ic=FI[f.name.toLowerCase()]||'◇',on=f.name===curFolder?'on':'',u=f.unread||0;
    return`<button class="fi ${on}" onclick="sw('${esc(f.name)}',this)">
      <span class="fi-ic">${ic}</span><span class="fi-nm">${esc(f.name)}</span>
      <span class="fi-ct ${u===0?'z':''}">${u}</span>
    </button>`;
  }).join('');
}

function sw(name,el){
  document.querySelectorAll('.fi').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
  loadFolder(name);
}

function getFilt(){
  if(!query)return emails;
  const q=query.toLowerCase();
  return emails.filter(m=>dh(m.subject||'').toLowerCase().includes(q)||(m.fromAddress||m.sender||'').toLowerCase().includes(q)||(m.summary||'').toLowerCase().includes(q));
}

function renderAll(){
  const list=getFilt(), el=$('list');
  $('show-count').textContent=list.length;
  $('filter-info').textContent=query?`(filtered from ${emails.length})`:'';

  if(!list.length){
    el.innerHTML=`<div class="empty"><div class="empty-ic">${query?'🔍':'📭'}</div><div class="empty-t">${query?'No results':'Empty folder'}</div><div class="empty-s">${query?'Try different keywords':'No messages to display'}</div></div>`;
    return;
  }

  el.innerHTML=list.map((m,i)=>{
    const from=m.fromAddress||m.sender||'',name=snm(from),{bg,fg}=col(from);
    const u=m.status==='0',sj=dh(m.subject||'(No Subject)');
    return`<div class="email-row${u?' unread':''}" onclick="openMsg(${i},this)">
      <div class="e-av" style="background:${bg};color:${fg}">${ini(name||from)}</div>
      <div class="e-bd">
        <div class="e-fr">${esc(name||from||'Unknown')}</div>
        <div class="e-sj">${esc(sj)}</div>
        <div class="e-pv">${esc(m.summary||'')}</div>
      </div>
      <div class="e-rt">
        <span class="e-tm">${tS(m.receivedTime||m.sentDateInGMT)}</span>
        ${u?'<span class="e-ud"></span>':''}
      </div>
    </div>`;
  }).join('');
}

function doSearch(v){query=v;$('sb-q').value=v;$('main-q').value=v;renderAll()}
function doRefresh(){loadFolder(curFolder)}

async function openMsg(idx,el){
  const list=getFilt(),m=list[idx];if(!m)return;
  document.querySelectorAll('.email-row').forEach(r=>r.classList.remove('sel'));
  el.classList.add('sel');el.classList.remove('unread');
  $('det').style.display='flex';

  const from=m.fromAddress||m.sender||'',name=snm(from),{bg,fg}=col(from);
  $('d-sj').textContent=dh(m.subject||'(No Subject)');
  $('d-dt').textContent=tL(m.receivedTime||m.sentDateInGMT);
  const av=$('d-av');
  av.textContent=ini(name||from);
  av.style.cssText=`background:${bg};color:${fg};width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0`;
  $('d-nm').textContent=name||from;
  $('d-em').textContent=from;
  $('d-to').textContent='To: '+dh(m.toAddress||'');

  const bd=$('d-bd');
  bd.innerHTML='<div class="sk skl" style="width:90%"></div><div class="sk skl" style="width:74%"></div><div class="sk skl" style="width:83%"></div><div class="sk skl" style="width:55%;margin-top:18px"></div><div class="sk skl" style="width:77%"></div>';

  const mid=m.messageId||m.mid||'';
  if(!mid){bd.textContent=m.summary||'(No content)';return}
  try{
    const r=await fetch(`${API}?msgId=${encodeURIComponent(mid)}`);
    const d=await r.json();const msg=d.message||d;
    if(msg.htmlBody){
      const fr=document.createElement('iframe');
      fr.style.cssText='width:100%;border:none;min-height:400px;background:#fff;border-radius:8px';
      fr.srcdoc=msg.htmlBody;bd.innerHTML='';bd.appendChild(fr);
      fr.onload=()=>{try{fr.style.height=fr.contentDocument.body.scrollHeight+40+'px'}catch{}}
    }else{bd.textContent=msg.content||msg.body||m.summary||'(Empty)'}
  }catch(e){bd.textContent=m.summary||'Error: '+e.message}
}

function closeDet(){
  $('det').style.display='none';
  document.querySelectorAll('.email-row').forEach(r=>r.classList.remove('sel'));
}

loadFolder('');
</script>
</body>
