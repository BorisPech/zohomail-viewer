<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZohoMail Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Cal+Sans&display=swap" rel="stylesheet">
<style>
/* ════════════════════════════════════
   RESET & TOKENS
════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }
:root {
  /* backgrounds */
  --bg:   #06060F;
  --bg1:  #0D0D1F;
  --bg2:  #121228;
  --bg3:  #181838;
  /* borders */
  --line: rgba(255,255,255,.07);
  --line2:rgba(255,255,255,.12);
  /* brand */
  --indigo:  #6366F1;
  --indigo2: #818CF8;
  --rose:    #F43F5E;
  --emerald: #10B981;
  --amber:   #F59E0B;
  --sky:     #0EA5E9;
  /* text */
  --tx:  #F1F1FF;
  --tx2: #8B8BA7;
  --tx3: #4B4B68;
  /* misc */
  --r:  8px;
  --r2: 12px;
}

html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--tx); font-family: 'Inter', system-ui, sans-serif; font-size: 14px; line-height: 1.5 }
::-webkit-scrollbar { width: 4px }
::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 2px }

/* ════════════════════════════════════
   NOISE TEXTURE OVERLAY
════════════════════════════════════ */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  opacity: .4;
}

/* ════════════════════════════════════
   HEADER
════════════════════════════════════ */
.header {
  position: relative; z-index: 100;
  display: flex; align-items: center; gap: 12px;
  height: 54px; padding: 0 18px;
  background: rgba(6,6,15,.8);
  backdrop-filter: blur(24px) saturate(180%);
  border-bottom: 1px solid var(--line);
}
.header-logo {
  display: flex; align-items: center; gap: 9px;
}
.logo-mark {
  width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
  background: linear-gradient(135deg, var(--indigo), var(--rose));
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; box-shadow: 0 0 16px rgba(99,102,241,.35);
}
.logo-name {
  font-family: 'Cal Sans', 'Inter', sans-serif;
  font-size: 15px; font-weight: 600; letter-spacing: -.3px;
  color: var(--tx);
}
.header-gap { flex: 1 }
.status-pill {
  display: flex; align-items: center; gap: 6px;
  padding: 4px 12px; border-radius: 20px;
  background: var(--bg1); border: 1px solid var(--line2);
  font-size: 11px; color: var(--tx2); max-width: 200px; overflow: hidden;
}
.live { width: 6px; height: 6px; border-radius: 50%; background: var(--emerald); flex-shrink: 0; box-shadow: 0 0 6px var(--emerald); animation: glow 2s ease-in-out infinite }
@keyframes glow { 0%,100%{opacity:1} 50%{opacity:.4} }

/* ════════════════════════════════════
   LAYOUT GRID
════════════════════════════════════ */
.workspace {
  display: grid;
  grid-template-columns: 220px 1fr;
  height: calc(100vh - 54px);
  overflow: hidden;
  position: relative; z-index: 1;
}

/* ════════════════════════════════════
   SIDEBAR
════════════════════════════════════ */
.sidebar {
  display: flex; flex-direction: column;
  background: var(--bg1); border-right: 1px solid var(--line);
  overflow: hidden;
}
.sidebar-scroll { flex: 1; overflow-y: auto; padding: 8px 6px }
.sidebar-section {
  font-size: 10px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--tx3); padding: 6px 8px 4px;
}
.folder-btn {
  display: flex; align-items: center; gap: 8px;
  width: 100%; padding: 8px 10px;
  border: 1px solid transparent; border-radius: var(--r);
  background: transparent; color: var(--tx); text-align: left;
  cursor: pointer; transition: all .15s; margin-bottom: 1px;
  font-family: inherit; font-size: 13px;
}
.folder-btn:hover { background: var(--bg2); border-color: var(--line) }
.folder-btn.active {
  background: rgba(99,102,241,.1);
  border-color: rgba(99,102,241,.25);
  color: var(--indigo2);
}
.folder-icon { font-size: 13px; width: 18px; text-align: center; flex-shrink: 0 }
.folder-name { flex: 1; font-weight: 500 }
.folder-count {
  font-size: 11px; font-weight: 600; min-width: 20px; text-align: center;
  padding: 1px 6px; border-radius: 10px;
  background: var(--indigo); color: #fff;
}
.folder-count.zero { background: var(--bg3); color: var(--tx3) }
.sidebar-divider { height: 1px; background: var(--line); margin: 6px 10px }
.sidebar-footer { padding: 10px 14px; flex-shrink: 0; border-top: 1px solid var(--line) }
.sidebar-footer-label { font-size: 10px; color: var(--tx3); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 3px }
.sidebar-footer-email { font-size: 11px; color: var(--tx2); word-break: break-all; line-height: 1.4 }

/* ════════════════════════════════════
   CONTENT PANEL
════════════════════════════════════ */
.content { display: flex; flex-direction: column; overflow: hidden; background: var(--bg) }

/* toolbar */
.toolbar {
  display: flex; gap: 8px; align-items: center;
  padding: 10px 16px;
  background: var(--bg1); border-bottom: 1px solid var(--line); flex-shrink: 0;
}
.search {
  flex: 1; display: flex; align-items: center; gap: 8px;
  background: var(--bg2); border: 1px solid var(--line); border-radius: var(--r);
  padding: 7px 12px; transition: border-color .15s;
}
.search:focus-within { border-color: var(--indigo) }
.search-icon { color: var(--tx3); font-size: 13px; flex-shrink: 0 }
.search input {
  flex: 1; background: transparent; border: none; outline: none;
  color: var(--tx); font-size: 13px; font-family: inherit;
}
.search input::placeholder { color: var(--tx3) }
.action-btn {
  display: flex; align-items: center; gap: 5px;
  padding: 7px 13px; border-radius: var(--r);
  background: var(--bg2); border: 1px solid var(--line);
  color: var(--tx2); font-size: 12px; font-weight: 500;
  cursor: pointer; transition: all .15s; white-space: nowrap; font-family: inherit;
}
.action-btn:hover { border-color: var(--indigo); color: var(--indigo2) }

/* stats */
.stats { display: flex; border-bottom: 1px solid var(--line); flex-shrink: 0 }
.stat { flex: 1; padding: 10px 16px; display: flex; align-items: center; gap: 10px; background: var(--bg1) }
.stat + .stat { border-left: 1px solid var(--line) }
.stat-accent { width: 3px; height: 28px; border-radius: 2px; flex-shrink: 0 }
.stat-value { font-size: 20px; font-weight: 700; line-height: 1; color: var(--tx) }
.stat-label { font-size: 11px; color: var(--tx3); margin-top: 2px }

/* ════════════════════════════════════
   EMAIL LIST
════════════════════════════════════ */
.email-list { flex: 1; overflow-y: auto }

.email-row {
  display: grid; grid-template-columns: 44px 1fr 60px;
  gap: 10px; align-items: start; padding: 12px 16px;
  border-bottom: 1px solid var(--line);
  cursor: pointer; transition: background .1s; position: relative;
}
.email-row:hover { background: var(--bg1) }
.email-row.is-unread { background: rgba(99,102,241,.04) }
.email-row.is-unread::after {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0;
  width: 2px; background: var(--indigo); border-radius: 0 1px 1px 0;
}
.email-row.is-selected { background: var(--bg2) }

.email-avatar {
  width: 40px; height: 40px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; flex-shrink: 0;
}
.email-main { min-width: 0 }
.email-from {
  font-size: 13px; font-weight: 500; margin-bottom: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--tx);
}
.email-row:not(.is-unread) .email-from { color: var(--tx2); font-weight: 400 }
.email-subject {
  font-size: 12px; margin-bottom: 3px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.email-row.is-unread .email-subject { color: var(--tx); font-weight: 500 }
.email-row:not(.is-unread) .email-subject { color: var(--tx3) }
.email-preview { font-size: 11px; color: var(--tx3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }

.email-side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0 }
.email-time { font-size: 10px; color: var(--tx3) }
.unread-badge { width: 7px; height: 7px; border-radius: 50%; background: var(--indigo); box-shadow: 0 0 5px var(--indigo) }

/* empty state */
.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; padding: 40px; text-align: center; color: var(--tx3) }
.empty-icon { font-size: 40px; margin-bottom: 14px; opacity: .4 }
.empty-title { font-size: 16px; font-weight: 600; color: var(--tx2); margin-bottom: 6px }
.empty-subtitle { font-size: 13px; line-height: 1.6 }

/* pagination */
.pagination {
  display: flex; align-items: center; justify-content: center; gap: 4px;
  padding: 10px 16px; border-top: 1px solid var(--line);
  background: var(--bg1); flex-shrink: 0;
}
.page-btn {
  width: 30px; height: 30px; border-radius: var(--r); border: 1px solid var(--line);
  background: var(--bg2); color: var(--tx); cursor: pointer;
  font-size: 12px; font-weight: 500; display: flex; align-items: center; justify-content: center;
  transition: all .13s; font-family: inherit;
}
.page-btn:hover, .page-btn.on { background: var(--indigo); border-color: var(--indigo); color: #fff }
.page-btn:disabled { opacity: .3; cursor: default; pointer-events: none }
.page-info { font-size: 12px; color: var(--tx3); padding: 0 8px }

/* ════════════════════════════════════
   DETAIL PANEL
════════════════════════════════════ */
.detail {
  position: fixed; top: 54px; right: 0;
  width: 50vw; max-width: 760px; height: calc(100vh - 54px);
  background: var(--bg1); border-left: 1px solid var(--line2);
  display: none; flex-direction: column; z-index: 50;
  animation: slide-in .2s cubic-bezier(.22,1,.36,1);
}
@keyframes slide-in { from { transform: translateX(20px); opacity: 0 } to { transform: none; opacity: 1 } }

.detail-header {
  padding: 16px 20px; border-bottom: 1px solid var(--line);
  display: flex; gap: 10px; align-items: flex-start; flex-shrink: 0;
}
.close-btn {
  width: 28px; height: 28px; border-radius: var(--r); flex-shrink: 0;
  background: var(--bg2); border: 1px solid var(--line);
  color: var(--tx2); cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 13px; transition: all .13s; font-family: inherit;
}
.close-btn:hover { border-color: var(--rose); color: var(--rose) }
.detail-subject {
  font-size: 15px; font-weight: 600; line-height: 1.35; margin-bottom: 3px; color: var(--tx);
}
.detail-date { font-size: 11px; color: var(--tx3) }

.detail-meta {
  padding: 12px 20px; border-bottom: 1px solid var(--line);
  display: flex; gap: 10px; background: var(--bg2); flex-shrink: 0;
}
.detail-avatar { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0 }
.detail-sender-name { font-size: 13px; font-weight: 600; margin-bottom: 2px }
.detail-sender-email { font-size: 11px; color: var(--tx3) }
.detail-to { font-size: 11px; color: var(--tx3); margin-top: 2px }

.detail-actions { padding: 8px 20px; border-bottom: 1px solid var(--line); display: flex; gap: 6px; flex-shrink: 0 }
.detail-action {
  padding: 5px 12px; border-radius: var(--r); border: 1px solid var(--line);
  background: var(--bg2); color: var(--tx2); font-size: 12px; font-weight: 500;
  cursor: pointer; transition: all .13s; font-family: inherit;
}
.detail-action:hover { border-color: var(--indigo); color: var(--indigo2) }

.detail-body { flex: 1; overflow-y: auto; padding: 20px }
.detail-body-text { font-size: 13px; line-height: 1.85; color: #C8C8E0; white-space: pre-wrap; word-break: break-word }

/* ════════════════════════════════════
   LOADER
════════════════════════════════════ */
#global-loader {
  position: fixed; inset: 0; z-index: 200;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  background: var(--bg);
}
.spinner {
  width: 36px; height: 36px; border: 2.5px solid var(--line2);
  border-top-color: var(--indigo); border-radius: 50%;
  animation: spin .65s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg) } }
.spinner-label { font-size: 13px; color: var(--tx2) }

/* skeleton */
.skeleton { background: linear-gradient(90deg,var(--bg2) 0%,var(--bg3) 50%,var(--bg2) 100%); background-size: 200%; animation: shim 1.2s infinite; border-radius: 4px }
@keyframes shim { 0%{background-position:200%} 100%{background-position:-200%} }
.sk-line { height: 10px; margin-bottom: 8px }

/* toast */
#toast {
  position: fixed; bottom: 18px; right: 18px; z-index: 300;
  padding: 11px 18px; border-radius: var(--r2);
  background: var(--bg2); border: 1px solid var(--line2); border-left: 3px solid var(--emerald);
  font-size: 12px; color: var(--tx); display: none;
  box-shadow: 0 8px 24px rgba(0,0,0,.4); animation: pop-up .2s ease;
}
#toast.error { border-left-color: var(--rose) }
@keyframes pop-up { from{transform:translateY(8px);opacity:0} to{transform:none;opacity:1} }

/* responsive */
@media (max-width: 700px) {
  .workspace { grid-template-columns: 1fr }
  .sidebar { display: none }
  .detail { width: 100vw }
  .stats { display: none }
}
</style>
</head>
<body>

<!-- Loader -->
<div id="global-loader">
  <div class="spinner"></div>
  <div class="spinner-label" id="loader-label">Connecting to Zoho Mail...</div>
</div>

<!-- Header -->
<header class="header">
  <div class="header-logo">
    <div class="logo-mark">✉</div>
    <span class="logo-name">ZohoMail Viewer</span>
  </div>
  <div class="header-gap"></div>
  <div class="status-pill">
    <span class="live"></span>
    <span id="header-email" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Loading...</span>
  </div>
</header>

<!-- Workspace -->
<div class="workspace">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-scroll">
      <div class="sidebar-section">Folders</div>
      <div id="folder-list"></div>
    </div>
    <div class="sidebar-divider"></div>
    <div class="sidebar-footer">
      <div class="sidebar-footer-label">Account</div>
      <div class="sidebar-footer-email" id="sidebar-email">—</div>
    </div>
  </aside>

  <!-- Content -->
  <section class="content">

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="search">
        <span class="search-icon">⌕</span>
        <input id="search-box" type="text" placeholder="Search by sender, subject or content..." oninput="onSearch()">
      </div>
      <button class="action-btn" onclick="doRefresh()">↻ Refresh</button>
    </div>

    <!-- Stats bar -->
    <div class="stats">
      <div class="stat">
        <div class="stat-accent" style="background:var(--indigo)"></div>
        <div>
          <div class="stat-value" id="stat-total">—</div>
          <div class="stat-label">Emails</div>
        </div>
      </div>
      <div class="stat">
        <div class="stat-accent" style="background:var(--rose)"></div>
        <div>
          <div class="stat-value" id="stat-unread">—</div>
          <div class="stat-label">Unread</div>
        </div>
      </div>
      <div class="stat">
        <div class="stat-accent" style="background:var(--emerald)"></div>
        <div>
          <div class="stat-value" id="stat-folder" style="font-size:13px;padding-top:3px">—</div>
          <div class="stat-label">Folder</div>
        </div>
      </div>
    </div>

    <!-- Email list -->
    <div class="email-list" id="email-list"></div>
    <div class="pagination" id="pagination"></div>

  </section>
</div>

<!-- Detail Panel -->
<div class="detail" id="detail-panel">
  <div class="detail-header">
    <button class="close-btn" onclick="closeDetail()">✕</button>
    <div style="flex:1;min-width:0">
      <div class="detail-subject" id="detail-subject">—</div>
      <div class="detail-date" id="detail-date"></div>
    </div>
  </div>
  <div class="detail-meta">
    <div class="detail-avatar" id="detail-avatar">?</div>
    <div>
      <div class="detail-sender-name"  id="detail-name"></div>
      <div class="detail-sender-email" id="detail-from"></div>
      <div class="detail-to"           id="detail-to"></div>
    </div>
  </div>
  <div class="detail-actions">
    <button class="detail-action">↩ Reply</button>
    <button class="detail-action">→ Forward</button>
    <button class="detail-action">⬇ Download</button>
  </div>
  <div class="detail-body">
    <div id="detail-body" class="detail-body-text"></div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ════ CONFIG ════ */
const API_URL = '/api/emails';
const PAGE_SIZE = 30;

/* ════ STATE ════ */
let allEmails   = [];
let allFolders  = [];
let activeFolder = '';
let currentPage  = 1;
let searchQuery  = '';

/* ════ COLOR MAP ════ */
const COLORS = [
  '#6366F1','#F43F5E','#10B981','#F59E0B',
  '#0EA5E9','#8B5CF6','#EC4899','#14B8A6',
];
const FOLDER_ICONS = {
  inbox:'📥', sent:'📤', drafts:'📝', spam:'🚫',
  trash:'🗑️', archive:'📦', notification:'🔔',
  newsletter:'📰', templates:'📋', snoozed:'😴',
  outbox:'📬', starred:'⭐',
};
const FOLDER_ORDER = [
  'Inbox','Sent','Drafts','Spam','Trash',
  'Templates','Snoozed','Outbox','Notification','Newsletter','Archive',
];

/* ════ HELPERS ════ */
const ge = id => document.getElementById(id);

function hashColor(str) {
  let h = 0;
  for (const c of str || '') h = (h * 31 + c.charCodeAt(0)) % COLORS.length;
  return COLORS[h];
}

function initials(str) {
  return (str || '?').split(/[\s@]+/).map(w => w[0]).join('').toUpperCase().slice(0, 2) || '?';
}

function escHtml(str) {
  return String(str || '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function decodeHtml(str) {
  const el = document.createElement('textarea');
  el.innerHTML = str || '';
  return el.value;
}

function senderName(addr) {
  if (!addr) return '';
  if (addr.includes('<')) return addr.split('<')[0].trim().replace(/['"]/g, '');
  return addr.split('@')[0];
}

function formatTime(ms) {
  if (!ms) return '';
  const d = new Date(+ms), now = new Date();
  if (d.toDateString() === now.toDateString()) {
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }
  if (now - d < 7 * 864e5) return d.toLocaleDateString([], { weekday: 'short' });
  return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
}

function formatFullDate(ms) {
  if (!ms) return '';
  return new Date(+ms).toLocaleString([], { dateStyle: 'full', timeStyle: 'short' });
}

/* ════ LOADER / TOAST ════ */
function showLoader(msg) {
  ge('global-loader').style.display = 'flex';
  ge('loader-label').textContent = msg || 'Loading...';
}
function hideLoader() {
  ge('global-loader').style.display = 'none';
}
function showToast(msg, isError = false) {
  const el = ge('toast');
  el.textContent = msg;
  el.className = isError ? 'error' : '';
  el.style.display = 'block';
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.style.display = 'none', 5000);
}

/* ════ DATA LOADING ════ */
async function loadFolder(folderName = '') {
  showLoader(folderName ? `Loading ${folderName}...` : 'Loading emails...');
  closeDetail();
  try {
    const url = folderName
      ? `${API_URL}?folder=${encodeURIComponent(folderName)}&limit=200`
      : `${API_URL}?limit=200`;

    const res  = await fetch(url);
    const data = await res.json();

    if (data.error) throw new Error(data.error);

    allEmails    = Array.isArray(data.emails)  ? data.emails  : [];
    allFolders   = Array.isArray(data.folders) ? data.folders : [];
    activeFolder = data.activeFolder || folderName || '';

    /* Update header */
    const email = data.accountEmail || '';
    ge('header-email').textContent  = email || 'Connected';
    ge('sidebar-email').textContent = email;

    /* Update stats */
    ge('stat-total').textContent  = allEmails.length;
    ge('stat-unread').textContent = allEmails.filter(m => m.status === '0').length;
    ge('stat-folder').textContent = activeFolder || '—';

    renderFolderList();

    currentPage  = 1;
    searchQuery  = '';
    ge('search-box').value = '';
    renderEmailList();
    hideLoader();

  } catch (err) {
    hideLoader();
    ge('email-list').innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">⚠️</div>
        <div class="empty-title">Could not load emails</div>
        <div class="empty-subtitle">
          ${escHtml(err.message)}<br><br>
          <strong>Debug:</strong> Open <code>/api/emails?debug=1</code> in browser<br>
          to see exactly what Zoho is returning.
        </div>
      </div>`;
    showToast(err.message, true);
  }
}

/* ════ FOLDER LIST ════ */
function renderFolderList() {
  const map = {};
  allFolders.forEach(f => map[f.name] = f);

  const ordered = [];
  FOLDER_ORDER.forEach(n => { if (map[n]) ordered.push(map[n]) });
  allFolders.forEach(f => { if (!FOLDER_ORDER.includes(f.name)) ordered.push(f) });

  ge('folder-list').innerHTML = ordered.map(f => {
    const icon   = FOLDER_ICONS[f.name.toLowerCase()] || '📁';
    const active = f.name === activeFolder ? 'active' : '';
    const count  = f.unread || 0;
    return `
      <button class="folder-btn ${active}" onclick="switchFolder('${escHtml(f.name)}', this)">
        <span class="folder-icon">${icon}</span>
        <span class="folder-name">${escHtml(f.name)}</span>
        <span class="folder-count ${count === 0 ? 'zero' : ''}">${count}</span>
      </button>`;
  }).join('');
}

function switchFolder(name, el) {
  document.querySelectorAll('.folder-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  loadFolder(name);
}

/* ════ EMAIL LIST ════ */
function filteredEmails() {
  if (!searchQuery) return allEmails;
  const q = searchQuery.toLowerCase();
  return allEmails.filter(m =>
    decodeHtml(m.subject || '').toLowerCase().includes(q) ||
    (m.fromAddress || m.sender || '').toLowerCase().includes(q) ||
    (m.summary || '').toLowerCase().includes(q)
  );
}

function renderEmailList() {
  const list    = filteredEmails();
  const total   = list.length;
  const start   = (currentPage - 1) * PAGE_SIZE;
  const page    = list.slice(start, start + PAGE_SIZE);
  const listEl  = ge('email-list');

  if (!page.length) {
    listEl.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">${searchQuery ? '🔍' : '📭'}</div>
        <div class="empty-title">${searchQuery ? 'No results found' : 'This folder is empty'}</div>
        <div class="empty-subtitle">${searchQuery ? 'Try a different search term' : 'No emails to display'}</div>
      </div>`;
    ge('pagination').innerHTML = '';
    return;
  }

  listEl.innerHTML = page.map((m, i) => {
    const addr    = m.fromAddress || m.sender || '';
    const name    = senderName(addr);
    const color   = hashColor(addr);
    const isUnread = m.status === '0';
    const subject  = decodeHtml(m.subject || '(No Subject)');
    const idx      = start + i;

    return `
      <div class="email-row ${isUnread ? 'is-unread' : ''}" onclick="openEmail(${idx}, this)">
        <div class="email-avatar" style="background:${color}22;color:${color}">
          ${initials(name || addr)}
        </div>
        <div class="email-main">
          <div class="email-from">${escHtml(name || addr || 'Unknown')}</div>
          <div class="email-subject">${escHtml(subject)}</div>
          <div class="email-preview">${escHtml(m.summary || '')}</div>
        </div>
        <div class="email-side">
          <span class="email-time">${formatTime(m.receivedTime || m.sentDateInGMT)}</span>
          ${isUnread ? '<span class="unread-badge"></span>' : ''}
        </div>
      </div>`;
  }).join('');

  renderPagination(total);
}

function renderPagination(total) {
  const pages = Math.ceil(total / PAGE_SIZE);
  const el    = ge('pagination');

  if (pages <= 1) { el.innerHTML = ''; return; }

  const MAX = 7;
  let s = Math.max(1, Math.min(currentPage - 3, pages - MAX + 1));
  let e = Math.min(pages, s + MAX - 1);
  s     = Math.max(1, e - MAX + 1);

  let html = `<button class="page-btn" onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>‹</button>`;
  if (s > 1) html += `<button class="page-btn" onclick="goToPage(1)">1</button><span class="page-info">…</span>`;
  for (let i = s; i <= e; i++) {
    html += `<button class="page-btn${i === currentPage ? ' on' : ''}" onclick="goToPage(${i})">${i}</button>`;
  }
  if (e < pages) html += `<span class="page-info">…</span><button class="page-btn" onclick="goToPage(${pages})">${pages}</button>`;
  html += `<button class="page-btn" onclick="goToPage(${currentPage + 1})" ${currentPage === pages ? 'disabled' : ''}>›</button>`;
  html += `<span class="page-info">${total} messages</span>`;

  el.innerHTML = html;
}

function goToPage(n) {
  const pages = Math.ceil(filteredEmails().length / PAGE_SIZE);
  if (n < 1 || n > pages) return;
  currentPage = n;
  renderEmailList();
  ge('email-list').scrollTop = 0;
}

function onSearch() {
  searchQuery = ge('search-box').value;
  currentPage = 1;
  renderEmailList();
}

function doRefresh() { loadFolder(activeFolder) }

/* ════ EMAIL DETAIL ════ */
async function openEmail(idx, el) {
  const list = filteredEmails();
  const m    = list[idx];
  if (!m) return;

  document.querySelectorAll('.email-row').forEach(r => r.classList.remove('is-selected'));
  el.classList.add('is-selected');
  el.classList.remove('is-unread');

  const panel = ge('detail-panel');
  panel.style.display = 'flex';

  /* Fill from list data immediately */
  const addr  = m.fromAddress || m.sender || '';
  const name  = senderName(addr);
  const color = hashColor(addr);

  ge('detail-subject').textContent = decodeHtml(m.subject || '(No Subject)');
  ge('detail-date').textContent    = formatFullDate(m.receivedTime || m.sentDateInGMT);

  const av = ge('detail-avatar');
  av.textContent  = initials(name || addr);
  av.style.cssText = `background:${color}22;color:${color};width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0`;

  ge('detail-name').textContent = name || addr;
  ge('detail-from').textContent = addr;
  ge('detail-to').textContent   = 'To: ' + decodeHtml(m.toAddress || '');

  /* Skeleton while loading full body */
  const bodyEl = ge('detail-body');
  bodyEl.innerHTML = `
    <div class="skeleton sk-line" style="width:92%"></div>
    <div class="skeleton sk-line" style="width:78%"></div>
    <div class="skeleton sk-line" style="width:85%"></div>
    <div class="skeleton sk-line" style="width:58%;margin-top:20px"></div>
    <div class="skeleton sk-line" style="width:74%"></div>
    <div class="skeleton sk-line" style="width:66%"></div>`;

  /* Fetch full message */
  const mid = m.messageId || m.mid || '';
  if (!mid) { bodyEl.textContent = m.summary || '(No message ID)'; return }

  try {
    const res  = await fetch(`${API_URL}?msgId=${encodeURIComponent(mid)}`);
    const data = await res.json();
    const msg  = data.message || data;

    if (msg.htmlBody) {
      const iframe = document.createElement('iframe');
      iframe.style.cssText = 'width:100%;border:none;min-height:400px;background:#fff;border-radius:8px';
      iframe.srcdoc = msg.htmlBody;
      bodyEl.innerHTML = '';
      bodyEl.appendChild(iframe);
      iframe.onload = () => {
        try { iframe.style.height = iframe.contentDocument.body.scrollHeight + 40 + 'px' } catch {}
      };
    } else {
      bodyEl.textContent = msg.content || msg.body || m.summary || '(Empty)';
    }
  } catch (err) {
    bodyEl.textContent = m.summary || 'Error: ' + err.message;
  }
}

function closeDetail() {
  ge('detail-panel').style.display = 'none';
  document.querySelectorAll('.email-row').forEach(r => r.classList.remove('is-selected'));
}

/* ════ INIT ════ */
loadFolder('');
